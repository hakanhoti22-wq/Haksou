<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Haksou — Traduction</title>
  <meta name="description" content="Traduction instantanée écrite et vocale dans plus de 180 langues, avec mode conversation.">
  <meta name="theme-color" content="#F6EFE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1813" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Haksou">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- En-tête -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M6 9.5A4.5 4.5 0 0 1 10.5 5h11A4.5 4.5 0 0 1 26 9.5v6a4.5 4.5 0 0 1-4.5 4.5H15l-5.2 4.3c-.7.6-1.8.1-1.8-.8V20A4.5 4.5 0 0 1 6 15.5z" fill="currentColor"/></svg>
          </span>
          <span class="brand-name">Haksou</span>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>

      <div class="segmented" role="tablist" aria-label="Mode">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button role="tab" data-mode="text" aria-selected="true">Traduire</button>
        <button role="tab" data-mode="conv" aria-selected="false">Conversation</button>
      </div>

      <div class="langbar">
        <button class="lang-pill" id="srcBtn" data-side="src">
          <span class="lang-pill-label" id="srcLabel">Français</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button class="swap-btn" id="swapBtn" aria-label="Inverser les langues">
          <svg viewBox="0 0 24 24"><path d="M7 7h12m0 0-3.5-3.5M19 7l-3.5 3.5M17 17H5m0 0 3.5 3.5M5 17l3.5-3.5"/></svg>
        </button>
        <button class="lang-pill" id="tgtBtn" data-side="tgt">
          <span class="lang-pill-label" id="tgtLabel">Anglais</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Fil de messages -->
    <main class="thread" id="thread" aria-live="polite">
      <div class="thread-inner" id="threadInner"></div>
    </main>

    <!-- Bandeau d'état -->
    <div class="status" id="status" hidden>
      <span class="status-dot"></span><span id="statusText"></span>
    </div>

    <!-- Barre de saisie : mode Traduire -->
    <footer class="composer" id="composerText">
      <div class="composer-field">
        <textarea id="input" rows="1" placeholder="Écrire pour traduire…" autocomplete="off" autocorrect="on" spellcheck="true" enterkeyhint="send"></textarea>
        <button class="field-btn send-btn" id="sendBtn" aria-label="Traduire" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>
      <button class="mic-btn" id="micBtn" aria-label="Parler pour traduire">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <svg class="stop-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      </button>
    </footer>

    <!-- Barre de saisie : mode Conversation -->
    <footer class="composer conv-composer" id="composerConv" hidden>
      <button class="conv-btn conv-btn-b" id="convBtnB" data-side="b">
        <span class="conv-btn-circle">
          <span class="mic-ring" aria-hidden="true"></span>
          <svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
        </span>
        <span class="conv-btn-label" id="convLabelB">Anglais</span>
      </button>
      <button class="conv-btn conv-btn-a" id="convBtnA" data-side="a">
        <span class="conv-btn-circle">
          <span class="mic-ring" aria-hidden="true"></span>
          <svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
        </span>
        <span class="conv-btn-label" id="convLabelA">Français</span>
      </button>
    </footer>
  </div>

  <!-- Feuille : choix de langue -->
  <div class="sheet-backdrop" id="langBackdrop" hidden></div>
  <section class="sheet" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="langSheetTitle" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="langSheetTitle">Langue source</h2>
      <button class="text-btn" data-close>OK</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="langSearch" type="search" placeholder="Rechercher une langue" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="sheet-body" id="langList"></div>
  </section>

  <!-- Feuille : réglages -->
  <div class="sheet-backdrop" id="settingsBackdrop" hidden></div>
  <section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="settingsTitle">Réglages</h2>
      <button class="text-btn" data-close>OK</button>
    </div>
    <div class="sheet-body">
      <div class="group-title">Voix</div>
      <div class="group">
        <label class="row">
          <span class="row-text"><span>Lecture automatique</span><small>Énoncer la traduction après avoir parlé</small></span>
          <input type="checkbox" class="switch" id="optAutoSpeak">
        </label>
        <label class="row row-col">
          <span class="row-text"><span>Vitesse de la voix</span><small id="rateValue">Normale</small></span>
          <input type="range" id="optRate" min="0.6" max="1.3" step="0.05">
        </label>
      </div>

      <div class="group-title">Micro</div>
      <div class="group">
        <label class="row row-col">
          <span class="row-text"><span>Arrêt automatique après un silence</span><small id="silenceValue">1,2 s</small></span>
          <input type="range" id="optSilence" min="0.6" max="3" step="0.1">
        </label>
        <label class="row">
          <span class="row-text"><span>Enchaînement automatique</span><small>En conversation, rouvre le micro de l'autre personne après la lecture</small></span>
          <input type="checkbox" class="switch" id="optAutoChain">
        </label>
      </div>

      <div class="group-title">Historique</div>
      <div class="group">
        <button class="row row-btn danger" id="clearBtn">Effacer la conversation</button>
      </div>

      <p class="foot-note" id="envNote"></p>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
