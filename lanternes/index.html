<title>Nuit des Lanternes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@600;800;900&display=swap">
<style>
  /* Arène plein écran vue de dessus + camp du ninja (menus de progression) en surimpression. Ambiance nocturne unique. */
  :root {
    --night: #13112a;
    --night-2: #1c1940;
    --glass: rgba(19, 17, 42, 0.8);
    --line: rgba(246, 239, 226, 0.12);
    --paper: #f6efe2;
    --muted: rgba(246, 239, 226, 0.68);
    --lantern: #ff9a3c;
    --spirit: #6ff0e0;
    --blood: #e5484d;
    --gold: #ffd166;
    --jade: #4fe0a0;
    --ok: #7ee08a;
    --display: "Dela Gothic One", "Impact", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--night); color: var(--paper);
    font-family: var(--body); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: var(--body); }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas#c { display: block; width: 100%; height: 100%; }

  /* ---------- HUD de combat ---------- */
  .xp { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: rgba(255,255,255,0.08); pointer-events: none; }
  .xp i { display: block; height: 100%; width: 0; background: var(--spirit); box-shadow: 0 0 10px var(--spirit); }
  .hud {
    position: absolute; top: 14px; left: 0; right: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .vitals { display: grid; gap: 6px; min-width: 0; }
  .hp { position: relative; width: min(200px, 100%); height: 18px; border-radius: 9px; background: var(--glass); overflow: hidden; }
  .hp i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--blood); }
  .hp span { position: relative; display: block; text-align: center; font-weight: 800; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .lvl { font-family: var(--display); font-size: 13px; color: var(--spirit); text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .lvl span.stg { color: var(--paper); opacity: 0.8; margin-left: 6px; }
  .clock { text-align: center; }
  .clock b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  .clock small { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
  .right { display: flex; justify-content: flex-end; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { background: var(--glass); border-radius: 999px; padding: 6px 11px; font-family: var(--display); font-size: 14px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
  .chip small { font-family: var(--body); font-weight: 800; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .coin { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px #b8862b; position: relative; flex: none; }
  .coin::after { content: ""; position: absolute; inset: 4px; background: #7a5418; }
  .gem { width: 11px; height: 11px; background: var(--jade); transform: rotate(45deg); border-radius: 2px; flex: none; box-shadow: 0 0 6px rgba(79,224,160,0.6); }
  .icon-btn {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: var(--glass); color: var(--paper); cursor: pointer; font-weight: 800; font-size: 16px;
  }
  .icon-btn:focus-visible, .btn:focus-visible, .card:focus-visible, .tab:focus-visible, .stage:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }

  .boss { position: absolute; left: 50%; transform: translateX(-50%); top: 72px; width: min(340px, 72%); pointer-events: none; text-align: center; }
  .boss small { font-family: var(--display); font-size: 12px; letter-spacing: 0.04em; color: var(--blood); text-shadow: 0 1px 3px #000; }
  .boss div { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.5); overflow: hidden; margin-top: 3px; }
  .boss i { display: block; height: 100%; background: var(--blood); }

  .loadout {
    position: absolute; left: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 6px; max-width: 70%; pointer-events: none;
  }
  .slot { position: relative; width: 34px; height: 34px; border-radius: 10px; background: var(--glass); display: grid; place-items: center; color: var(--c); }
  .slot svg { width: 20px; height: 20px; }
  .slot em { position: absolute; right: -3px; bottom: -3px; font-style: normal; font-size: 10px; font-weight: 800; background: var(--paper); color: var(--night); border-radius: 6px; padding: 0 4px; line-height: 14px; }
  .banner {
    position: absolute; left: 0; right: 0; top: 33%; text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(22px, 5vw, 36px); color: var(--lantern);
    text-shadow: 0 3px 12px rgba(0,0,0,0.8);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #joy { position: absolute; width: 0; height: 0; pointer-events: none; }
  #joy .base { position: absolute; left: -48px; top: -48px; width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(246,239,226,0.35); background: rgba(19,17,42,0.25); }
  #joy .knob { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(246,239,226,0.55); }

  /* ---------- Fenêtres ---------- */
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; overflow-y: auto; touch-action: pan-y;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(10, 8, 24, 0.6);
  }
  .panel {
    background: var(--glass); border-radius: 20px; padding: 22px 22px; margin-block: 16px;
    width: 100%; max-width: 420px; text-align: center;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
    backdrop-filter: blur(6px); border: 1px solid rgba(255,154,60,0.25);
  }
  .panel.wide { max-width: 660px; }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.05; text-wrap: balance; color: var(--lantern); }
  .panel p { margin: 0; font-size: 15px; line-height: 1.45; }
  .result { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .result div { background: rgba(255,255,255,0.07); border-radius: 12px; padding: 8px 12px; min-width: 78px; }
  .result small { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .result strong { font-family: var(--display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
  .note { color: var(--spirit); font-weight: 800; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .btn {
    border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
    background: var(--lantern); color: var(--night);
    font-family: var(--display); font-size: 16px; box-shadow: 0 4px 0 #b25e14;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn.ghost { background: rgba(255,255,255,0.1); color: var(--paper); box-shadow: none; }
  .btn.sm { padding: 7px 12px; font-size: 13px; box-shadow: 0 3px 0 #b25e14; font-family: var(--body); font-weight: 900; }
  .btn.sm.ghost { box-shadow: none; }
  .btn.jade { background: var(--jade); box-shadow: 0 3px 0 #1f8a5a; }
  .btn.jade .gem { background: var(--night); box-shadow: none; }
  .btn:disabled { background: rgba(255,255,255,0.08); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .btn:not(:disabled):active { transform: translateY(2px); }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  .card {
    display: grid; grid-template-columns: 44px 1fr; column-gap: 10px; row-gap: 2px;
    text-align: left; align-items: start; cursor: pointer;
    background: rgba(255,255,255,0.06); color: var(--paper); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px;
  }
  @media (min-width: 561px) { .card { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
  .card:hover { border-color: var(--lantern); background: rgba(255,154,60,0.12); }
  .card .ic { grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,0.3); color: var(--c); }
  @media (min-width: 561px) { .card .ic { grid-row: auto; } }
  .card .ic svg { width: 26px; height: 26px; }
  .card b { font-size: 15px; }
  .card b small { display: inline-block; margin-left: 6px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--spirit); }
  .card span { font-size: 13px; line-height: 1.35; color: var(--muted); }
  .card kbd { font-family: var(--body); font-size: 10px; opacity: 0.5; }

  /* ---------- Camp (menus de progression) ---------- */
  .hub { place-items: start center; background: radial-gradient(120% 80% at 50% 0%, rgba(255,154,60,0.12), transparent 60%), rgba(10, 8, 24, 0.72); }
  .hub-in { width: 100%; max-width: 980px; padding-block: 16px 28px; display: grid; gap: 14px; }
  .hub-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand small { display: block; font-family: var(--display); font-size: 11px; letter-spacing: 0.32em; color: var(--muted); }
  .brand b { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); color: var(--lantern); line-height: 1; }
  .wallet { display: flex; gap: 8px; }
  .wallet .chip { font-size: 16px; padding: 8px 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; touch-action: pan-x; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--paper);
    border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 14px; cursor: pointer;
    display: inline-flex; gap: 6px; align-items: center;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab[aria-selected="true"] { background: var(--lantern); color: var(--night); border-color: var(--lantern); }
  .sect { display: grid; gap: 14px; }
  .sect h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--paper); }
  .sect h3 small { font-family: var(--body); font-size: 13px; font-weight: 800; color: var(--muted); margin-left: 8px; }
  .lead { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 68ch; }

  .hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  @media (max-width: 560px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
  .hero canvas { width: 96px; height: 96px; }
  .hero-body { display: grid; gap: 10px; min-width: 0; }
  .power { font-family: var(--display); font-size: 28px; color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }
  .power small { font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 8px; }
  .statline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .statline b { color: var(--paper); font-variant-numeric: tabular-nums; }
  .hero .row { justify-content: flex-start; }
  @media (max-width: 560px) { .hero .row { justify-content: center; } .statline { justify-content: center; } }

  .zone { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .zone-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .zone-head b { font-family: var(--display); font-weight: 400; font-size: 16px; }
  .zone-head span { font-size: 12px; color: var(--muted); font-weight: 800; }
  .zone.locked { opacity: 0.55; }
  .stages { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 560px) { .stages { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .stage {
    aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
    background: rgba(255,255,255,0.05); color: var(--paper); font-family: var(--display); font-size: 15px;
    display: grid; place-items: center; position: relative; padding: 0;
  }
  .stage small { position: absolute; bottom: 3px; left: 0; right: 0; font-family: var(--body); font-size: 9px; font-weight: 900; color: var(--ok); }
  .stage.boss-st { border-color: rgba(229,72,77,0.6); }
  .stage.cur { background: var(--lantern); color: var(--night); border-color: var(--lantern); }
  .stage.cur small { color: var(--night); }
  .stage:disabled { cursor: not-allowed; opacity: 0.35; }
  .stage.hard:not(:disabled):not(.cleared) { box-shadow: inset 0 0 0 2px var(--blood); }

  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .item { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; align-content: start; }
  .item.eq { border-color: var(--lantern); box-shadow: 0 0 0 1px var(--lantern) inset; }
  .item-top { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center; }
  .item-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: var(--c); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 28%, transparent), rgba(0,0,0,0.35)); }
  .item-ic svg { width: 26px; height: 26px; }
  .item-name { display: grid; gap: 2px; min-width: 0; }
  .item-name b { font-size: 15px; line-height: 1.2; }
  .rar { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
  .stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
  .stars i { font-style: normal; color: rgba(246,239,226,0.2); }
  .item p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .item p b { color: var(--paper); }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c, var(--lantern)); }
  .item .row { justify-content: flex-start; gap: 6px; }
  .lockline { font-size: 12px; font-weight: 800; color: var(--muted); }

  .charm-slots { display: flex; gap: 8px; flex-wrap: wrap; }
  .cslot { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 800; min-height: 44px; }
  .cslot.full { border-style: solid; border-color: rgba(255,154,60,0.5); }
  .cslot svg { width: 20px; height: 20px; color: var(--c); }
  .cslot.lock { opacity: 0.5; }

  .skin-prev { width: 64px; height: 64px; }
  .opt { display: grid; gap: 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .opt textarea { width: 100%; min-height: 70px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--paper); font: 12px/1.4 ui-monospace, monospace; padding: 8px; user-select: text; -webkit-user-select: text; }
  .toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--paper); color: var(--night); font-weight: 900; font-size: 14px; border-radius: 999px; padding: 9px 16px;
    pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { .btn:not(:disabled):active { transform: none; } }
</style>

<div id="app">
  <canvas id="c"></canvas>

  <div id="hudWrap" hidden>
    <div class="xp"><i id="xpBar"></i></div>
    <div class="hud">
      <div class="vitals">
        <div class="hp"><i id="hpBar"></i><span id="hpTxt">100 / 100</span></div>
        <div class="lvl">Niv. <span id="lvl">1</span><span class="stg" id="stgTxt">Nuit 1</span></div>
      </div>
      <div class="clock"><b id="clock">03:00</b><small id="clockSub">avant le gardien</small></div>
      <div class="right">
        <div class="chip"><span class="coin"></span><span id="gold">0</span></div>
        <div class="chip"><small>Tués</small><span id="kills">0</span></div>
        <button class="icon-btn" id="pauseBtn" aria-label="Pause">II</button>
      </div>
    </div>
    <div class="boss" id="boss" hidden><small id="bossName">Oni géant</small><div><i id="bossBar"></i></div></div>
    <div class="loadout" id="loadout"></div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div id="joy" hidden><div class="base"></div><div class="knob" id="knob"></div></div>

  <!-- Camp du ninja -->
  <div class="overlay hub" id="hub">
    <div class="hub-in">
      <header class="hub-head">
        <div class="brand"><small>HAKSOU</small><b>Nuit des Lanternes</b></div>
        <div class="wallet">
          <div class="chip" title="Ryō"><span class="coin"></span><span id="wRyo">0</span></div>
          <div class="chip" title="Jade"><span class="gem"></span><span id="wJade">0</span></div>
        </div>
      </header>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <section id="tabBody" class="sect"></section>
    </div>
  </div>

  <div class="overlay" id="levelScreen" hidden>
    <div class="panel wide">
      <h2>Niveau <span id="lvlUp">2</span>&nbsp;!</h2>
      <p>Choisis une technique.</p>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="panel">
      <h2>Pause</h2>
      <div class="result" id="pauseStats"></div>
      <p class="lead" style="text-align:center">Si tu abandonnes, tu gardes les ryō ramassés.</p>
      <div class="row">
        <button class="btn" id="resumeBtn">Continuer</button>
        <button class="btn ghost" id="quitBtn">Abandonner</button>
      </div>
      <button class="btn sm ghost" id="muteBtn">Son : activé</button>
    </div>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <div class="panel">
      <h2 id="endTitle">Tu es tombé…</h2>
      <p id="endTxt"></p>
      <div class="result" id="endStats"></div>
      <div class="result" id="endLoot"></div>
      <p id="endNote" class="note" hidden></p>
      <div class="row" id="endBtns"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rand = (a, b) => a + Math.random() * (b - a);
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmtN = n => {
    n = Math.floor(n);
    if (n < 10000) return String(n);
    const u = [['T', 1e12], ['B', 1e9], ['M', 1e6], ['k', 1e3]];
    for (const [s, v] of u) if (n >= v) { const x = n / v; return (x >= 100 ? Math.floor(x) : x.toFixed(1).replace('.0', '')).toString().replace('.', ',') + s; }
    return String(n);
  };

  const ARENA = 2400, CELL = 48, STAGES = 50;
  const HPG = 1.17;   // PV des morts-vivants : ×1,17 par niveau
  const DMG = 1.12;   // dégâts des morts-vivants : ×1,12 par niveau

  /* ================= Icônes ================= */
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICONS = {
    shuriken: svg('<path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="#13112a" stroke="none"/>'),
    katana: svg('<path d="M20 4L8 16"/><path d="M6 14l4 4"/><path d="M8 16l-4 4"/>'),
    orbit: svg('<circle cx="12" cy="12" r="8" stroke-dasharray="3 4"/><path d="M12 2l1.5 3h-3z" fill="currentColor"/><path d="M12 22l-1.5-3h3z" fill="currentColor"/><circle cx="12" cy="12" r="2"/>'),
    fire: svg('<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9 0 4 3 7 7 7z"/>'),

      x: ARENA / 2, y: ARENA / 2, r: 14, fx: 1, fy: 0, moving: false,
      hp: st.maxHp, maxHp: st.maxHp, baseMax: st.maxHp, def: st.def, speed: st.speed, magnet: st.magnet,
      regenPct: st.regenPct, might: 1, haste: st.haste, crit: st.crit,
      level: 1, xp: 0, xpNext: 5, inv: 0,
      weapons: { [st.tech]: { l: st.techLvl, t: 0.3 } }, passives: {},
    };
    for (let i = 0; i < 8; i++) spawnEnemy(pickType());
    ['hub', 'endScreen', 'pauseScreen', 'levelScreen'].forEach(id => $(id).hidden = true);
    $('hudWrap').hidden = false;
    $('stgTxt').textContent = endless ? 'Nuit sans fin' : `Nuit ${stage}`;
    $('clockSub').textContent = endless ? 'survécu' : 'avant le gardien';
    renderLoadout(); updateHud(true);
    state = 'play'; last = performance.now(); nextCry = 2;
    windStop(); windStart();
    banner(endless ? 'Nuit sans fin' : `${zone.name} · Nuit ${stage}`);
  }

  /* ---------- Grille spatiale ---------- */
  function buildGrid() {
    grid = new Map();
    for (const e of enemies) {
      const k = Math.floor(e.x / CELL) * 4096 + Math.floor(e.y / CELL);
      const a = grid.get(k); if (a) a.push(e); else grid.set(k, [e]);
    }
  }
  function near(x, y, r, cb) {
    const x0 = Math.floor((x - r - 50) / CELL), x1 = Math.floor((x + r + 50) / CELL);
    const y0 = Math.floor((y - r - 50) / CELL), y1 = Math.floor((y + r + 50) / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const a = grid.get(cx * 4096 + cy); if (!a) continue;
      for (const e of a) if (!e.dead && cb(e) === false) return;
    }
  }

  /* ---------- Apparition ---------- */
  function spawnPos(ang, dist) {
    let x, y, tries = 0;
    do {
      const a = ang ?? Math.random() * TAU;
      const d = dist ?? Math.hypot(viewW, viewH) / 2 + rand(30, 120);
      x = clamp(player.x + Math.cos(a) * d, 20, ARENA - 20);
      y = clamp(player.y + Math.sin(a) * d, 20, ARENA - 20);
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 260 && tries < 6 && ang === undefined);
    return [x, y];
  }
  function spawnEnemy(type, ang, dist, at) {
    const def = ENEMY[type], s = run ? run.effS : 1;
    const [x, y] = at || spawnPos(ang, dist);
    const ramp = run && !run.endless ? 1 + Math.min(1, time / run.dur) * 0.5 : 1;
    const eliteChance = run ? 0.01 + s * 0.0015 : 0;
    const elite = Math.random() < eliteChance;
    const hp = def.hp * Math.pow(HPG, s - 1) * ramp * (elite ? 7 : 1);
    const e = {
      type, x, y, r: def.r * (elite ? 1.45 : 1), hp, maxHp: hp, elite,
      speed: def.speed * (1 + Math.min(0.45, (s - 1) * 0.01)) * rand(0.92, 1.08) * (elite ? 0.85 : 1),
      dmg: def.dmg * Math.pow(DMG, s - 1) * (elite ? 1.6 : 1), xp: def.xp * (elite ? 6 : 1),
      flash: 0, kx: 0, ky: 0, orbitCd: 0, shoot: rand(1, 3), ph: Math.random() * TAU, dir: 0, dash: 0, dashCd: rand(2, 4),
    };
    enemies.push(e);
    return e;
  }
  function spawnBoss() {
    const s = run.effS, grand = !run.endless && run.stage % 10 === 0;
    const z = zone.boss;
    const [x, y] = spawnPos();
    const hp = 300 * Math.pow(HPG, s - 1) * (grand ? 2.2 : 1) * (run.endless ? 1.5 : 1);
    const moves = [...z.moves];
    if (grand && !moves.includes('ring')) moves.push('ring');
    if (s >= 30 && !moves.includes('summon')) moves.push('summon');
    const e = {
      type: 'boss', x, y, r: grand ? 50 : 40, hp, maxHp: hp, elite: false, grand,
      speed: 62 * (1 + Math.min(0.4, s * 0.008)), dmg: 16 * Math.pow(DMG, s - 1), xp: 40,
      flash: 0, kx: 0, ky: 0, orbitCd: 0, ph: 0, dir: 0, atk: 2.5, tele: 0, dashT: 0, dvx: 0, dvy: 0, moves,
      c1: z.c1, c2: z.c2, look: z.look,
    };
    enemies.push(e);
    boss = e;
    $('boss').hidden = false; $('bossName').textContent = (grand ? 'Grand ' : '') + z.name;
    banner((grand ? 'Le grand gardien' : 'Le gardien') + ' apparaît !'); sfx.boss();
    return e;
  }
  function pickType() {
    const mix = zone.mix;
    let sum = 0; for (const k in mix) sum += mix[k];
    let r = Math.random() * sum;
    for (const k in mix) if ((r -= mix[k]) < 0) return k;
    return 'zombie';
  }

  /* ---------- Dégâts ---------- */
  function hit(e, dmg, kx = 0, ky = 0, color) {
    if (e.dead) return;
    const crit = Math.random() < player.crit;
    dmg = dmg * run.st.dmg * player.might * (crit ? 2 : 1);
    e.hp -= dmg; e.flash = 0.1;
    const kb = e.type === 'boss' ? 0.1 : e.elite ? 0.4 : 1;
    e.kx += kx * kb; e.ky += ky * kb;
    if (texts.length < 70) texts.push({ x: e.x + rand(-6, 6), y: e.y - e.r, t: fmtN(Math.max(1, dmg)), life: 0.7, crit, color });
    sfx.hit(e.x, e.y);
    if (e.hp <= 0) kill(e);
  }
  function kill(e) {
    e.dead = true; kills++;
    const col = e.type === 'boss' ? e.c2 : ENEMY[e.type].col;
    burst(e.x, e.y, col, e.type === 'boss' ? 50 : e.elite ? 18 : 7);
    if (e.type === 'boss') { sfx.boss(); } else if (e.type !== 'gonfle') sfx.kill(e.type, e.x, e.y);
    dropGem(e.x, e.y, e.xp);
    if (e.type === 'gonfle') { // éclate en nuage toxique : ne reste pas collé !
      burst(e.x, e.y, '#c9d94a', 26); burst(e.x, e.y, '#7a4f86', 10); sfx.explode(e.x, e.y);
      pools.push({ x: e.x, y: e.y, r: 70, dmg: 0, life: 0.5, max: 0.5, tick: 99, toxic: true });
      if (Math.hypot(player.x - e.x, player.y - e.y) < 70 + player.r) hurtPlayer(e.dmg * 1.2);
    }
    const cv = Math.max(1, Math.round(Math.pow(1.15, run.effS - 1)));
    if (e.type === 'boss') {
      boss = null; $('boss').hidden = true;
      for (let i = 0; i < 12; i++) gems.push({ x: e.x + rand(-50, 50), y: e.y + rand(-50, 50), v: cv * 5, coin: true });
      gems.push({ x: e.x + 30, y: e.y, v: 0, heal: 0.4 });
      shake = Math.max(shake, 14);
      if (run.endless) { run.jade += 2; banner('Gardien vaincu ! +2 jade'); }
      else { run.won = true; banner('Le gardien est vaincu !'); setTimeout(() => { if (state === 'play' || state === 'levelup') endRun(true); }, 1600); }
    } else {
      if (e.elite) for (let i = 0; i < 5; i++) gems.push({ x: e.x + rand(-20, 20), y: e.y + rand(-20, 20), v: cv, coin: true });
      else if (Math.random() < 0.35) gems.push({ x: e.x + rand(-8, 8), y: e.y + rand(-8, 8), v: cv, coin: true });
      if (Math.random() < 1 / 180) gems.push({ x: e.x, y: e.y, v: 0, heal: 0.25 });
    }
  }
  function dropGem(x, y, v) {
    if (gems.length > 500) { const g = gems[(Math.random() * gems.length) | 0]; if (!g.heal && !g.coin) { g.v += v; return; } }
    gems.push({ x, y, v });
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n && fx.length < 450; i++) {
      const a = Math.random() * TAU, s = rand(40, 180);
      fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.6), max: 0.6, color, size: rand(2, 4.5) });
    }
  }
  function hurtPlayer(d) {
    if (player.inv > 0 || state !== 'play') return;
    const K = 60 * Math.pow(DMG, run.effS - 1);
    const taken = d * K / (K + player.def);
    player.hp -= taken; player.inv = 0.6; hurtFlash = 0.35; shake = Math.max(shake, 6);
    sfx.hurt();
    if (player.hp <= 0) {
      if (run.revive > 0) {
        player.hp = player.maxHp * run.revive; run.revive = 0; player.inv = 2.5;
        banner('Le phénix te relève !'); sfx.revive(); burst(player.x, player.y, '#ffb347', 40);
        near(player.x, player.y, 220, e => { if (e.type !== 'boss' && Math.hypot(e.x - player.x, e.y - player.y) < 220) { e.hp = 0; kill(e); } });
      } else { player.hp = 0; endRun(false); }
    }
  }

  /* ---------- Techniques ---------- */
  function updateWeapons(dt) {
    const P = player;
    for (const id in P.weapons) {
      const w = P.weapons[id], s = WEAPONS[id].lv[w.l - 1];
      if (id === 'orbit') continue;
      w.t -= dt;
      if (w.t > 0) continue;
      w.t = s.cd * P.haste;
      if (id === 'shuriken') {
        let tgt = null, best = 520 * 520;
        for (const e of enemies) { const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2; if (d < best) { best = d; tgt = e; } }
        const base = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : Math.atan2(P.fy, P.fx);
        for (let i = 0; i < s.n; i++) {
          const a = base + (i - (s.n - 1) / 2) * 0.18;
          shots.push({ x: P.x, y: P.y, vx: Math.cos(a) * 440, vy: Math.sin(a) * 440, dmg: s.dmg, pierce: s.pierce, life: 1.2, rot: 0, hit: new Set() });
        }
        sfx.throw();
      } else if (id === 'katana') {
        // vise le monstre le plus proche à portée, sinon la direction de course
        let tgt = null, best = (s.r + 70) ** 2;
        for (const e of enemies) { const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2 - e.r * e.r; if (d < best) { best = d; tgt = e; } }
        const dirs = [tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : Math.atan2(P.fy, P.fx)]; if (s.back) dirs.push(dirs[0] + Math.PI);
        for (const ang of dirs) {
          slashes.push({ ang, r: s.r, life: 0.2 });
          near(P.x, P.y, s.r, e => {
            const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy);
            if (d > s.r + e.r) return;
            let da = Math.atan2(dy, dx) - ang; da = Math.atan2(Math.sin(da), Math.cos(da));
            if (Math.abs(da) < 1.25 || d < P.r + e.r) hit(e, s.dmg, dx / (d || 1) * 260, dy / (d || 1) * 260, '#ffd28a');
          });
        }
        sfx.slash();
      } else if (id === 'fire') {
        const cand = enemies.filter(e => Math.abs(e.x - P.x) < 320 && Math.abs(e.y - P.y) < 320);
        for (let i = 0; i < s.n; i++) {
          let tx = P.x + rand(-160, 160), ty = P.y + rand(-160, 160);
          if (cand.length) { const e = cand[(Math.random() * cand.length) | 0]; tx = e.x; ty = e.y; }
          pools.push({ x: tx, y: ty, r: s.r, dmg: s.dmg, life: s.dur, max: s.dur, tick: 0 });
        }
        sfx.fire(pools[pools.length - 1].x, pools[pools.length - 1].y);
      } else if (id === 'bolt') {
        const cand = enemies.filter(e => Math.abs(e.x - P.x) < viewW / 2 && Math.abs(e.y - P.y) < viewH / 2);
        if (boss && !boss.dead && !cand.includes(boss) && Math.hypot(boss.x - P.x, boss.y - P.y) < 600) cand.push(boss);
        for (let i = 0; i < s.n && cand.length; i++) {
          const k = (Math.random() * cand.length) | 0, e = cand.splice(k, 1)[0];
          bolts.push({ x: e.x, y: e.y, life: 0.25, seed: Math.random() * 1000 });
          hit(e, s.dmg, 0, 0, '#fff27a');
          near(e.x, e.y, 40, o => { if (o !== e && Math.hypot(o.x - e.x, o.y - e.y) < 40) hit(o, s.dmg * 0.4, 0, 0, '#fff27a'); });
          burst(e.x, e.y, '#fff27a', 6);
        }
        if (bolts.length) { lightFlash = 0.12; sfx.bolt(); }
      }
    }
    const ow = P.weapons.orbit;
    if (ow) {
      const s = WEAPONS.orbit.lv[ow.l - 1];
      orbitAng += s.spd * dt / P.haste;
      for (let i = 0; i < s.n; i++) {
        const a = orbitAng + i * TAU / s.n, bx = P.x + Math.cos(a) * s.r, by = P.y + Math.sin(a) * s.r;
        near(bx, by, 14, e => {
          if (e.orbitCd > 0) return;
          if (Math.hypot(e.x - bx, e.y - by) < e.r + 10) { e.orbitCd = 0.45; hit(e, s.dmg, Math.cos(a) * 200, Math.sin(a) * 200, '#9fe7ff'); }
        });
      }
    }
  }

  function bossAI(e, dt, dx, dy, d) {
    let vx = dx / d * e.speed, vy = dy / d * e.speed;
    if (e.dashT > 0) { e.dashT -= dt; vx = e.dvx; vy = e.dvy; }
    else if (e.tele > 0) { e.tele -= dt; vx = vy = 0; if (e.tele <= 0) { e.dashT = 0.55; e.dvx = Math.cos(e.dashA) * 560; e.dvy = Math.sin(e.dashA) * 560; } }
    e.atk -= dt;
    if (e.atk <= 0 && e.tele <= 0 && e.dashT <= 0) {
      e.atk = rand(2.4, 3.6) / (e.grand ? 1.35 : 1);
      const m = e.moves[(Math.random() * e.moves.length) | 0];
      if (m === 'dash') { e.tele = 0.65; e.dashA = Math.atan2(dy, dx); sfx.charge(e.x, e.y); }
      else if (m === 'ring') {
        const n = e.grand ? 22 : 14, off = Math.random() * TAU;
        for (let i = 0; i < n; i++) { const a = off + i * TAU / n; foes.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, life: 4, dmg: e.dmg * 0.6, kind: 'orb', col: e.c2 }); }
        sfx.ring(e.x, e.y);
      } else if (m === 'summon') {
        const types = Object.keys(zone.mix);
        for (let i = 0; i < (e.grand ? 8 : 5); i++) {
          const a = i * TAU / 5;
          spawnEnemy(types[(Math.random() * types.length) | 0], undefined, undefined, [clamp(e.x + Math.cos(a) * 70, 20, ARENA - 20), clamp(e.y + Math.sin(a) * 70, 20, ARENA - 20)]);
        }
      }
    }
    return [vx, vy];
  }

  /* ---------- Boucle ---------- */
  function update(dt) {
    const P = player;
    time += dt;
    if (run.endless) {
      run.effS = Math.min(80, run.base + Math.floor(time / 35));
      const z = zoneOf(Math.min(STAGES, run.effS));
      if (z !== zone) { buildWorld(z); banner(z.name); }
    }

    // Déplacement
    let mx = 0, my = 0;
    if (keys.has('left')) mx -= 1; if (keys.has('right')) mx += 1;
    if (keys.has('up')) my -= 1; if (keys.has('down')) my += 1;
    if (joy.active) { mx = joy.dx; my = joy.dy; }
    const ml = Math.hypot(mx, my);
    P.moving = ml > 0.1;
    if (P.moving) {
      const k = Math.min(1, ml) / ml;
      P.x = clamp(P.x + mx * k * P.speed * dt, P.r + 12, ARENA - P.r - 12);
      P.y = clamp(P.y + my * k * P.speed * dt, P.r + 12, ARENA - P.r - 12);
      P.fx = mx / ml; P.fy = my / ml;
    }
    P.inv -= dt;
    P.hp = Math.min(P.maxHp, P.hp + P.regenPct * P.maxHp * dt);

    // Apparitions
    const s = run.effS;
    let rate = 1 + s * 0.06 + time / 30;
    if (run.bossSpawned && !run.endless) rate *= 0.4;
    const cap = Math.min(340, 240 + s * 2);
    if (enemies.length < cap) spawnAcc += rate * dt;
    while (spawnAcc >= 1) {
      spawnAcc--;
      const t = pickType();
      if (t === 'rat') { const [x, y] = spawnPos(); for (let i = 0; i < 4; i++) spawnEnemy('rat', undefined, undefined, [clamp(x + rand(-30, 30), 20, ARENA - 20), clamp(y + rand(-30, 30), 20, ARENA - 20)]); }
      else spawnEnemy(t);
    }
    if (time >= nextRing) {
      nextRing += 65;
      const n = 16 + Math.floor(time / 15) + Math.floor(s / 3), types = Object.keys(zone.mix), type = types[(Math.random() * Math.min(2, types.length)) | 0];
      for (let i = 0; i < n; i++) spawnEnemy(type, i * TAU / n, 420);
      banner('Encerclé !');
    }
    if (!run.endless && !run.bossSpawned && time >= run.dur) { run.bossSpawned = true; spawnBoss(); }
    if (run.endless && time >= nextBoss) { nextBoss += 120; spawnBoss(); }

    // Morts-vivants
    for (const e of enemies) {
      const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
      let vx = dx / d * e.speed, vy = dy / d * e.speed;
      if (e.type === 'boss') [vx, vy] = bossAI(e, dt, dx, dy, d);
      else if (e.type === 'squelette') {
        if (d < 230) { vx = -vx * 0.7 + (-dy / d) * e.speed * 0.6; vy = -vy * 0.7 + (dx / d) * e.speed * 0.6; }
        e.shoot -= dt;
        if (e.shoot <= 0 && d < 460) { e.shoot = rand(2.2, 3.2); sfx.arrow(e.x, e.y); foes.push({ x: e.x, y: e.y, vx: dx / d * 230, vy: dy / d * 230, life: 3, dmg: e.dmg, kind: 'arrow' }); }
      } else if (e.type === 'chien') { e.ph += dt * 6; vx += Math.cos(e.ph) * 30; vy += Math.sin(e.ph) * 30; }
      else if (e.type === 'zombie') { e.ph += dt; vx += Math.cos(e.ph * 1.3) * 14; vy += Math.sin(e.ph * 1.7) * 14; }
      else if (e.type === 'spectre') {
        e.dashCd -= dt;
        if (e.dash > 0) { e.dash -= dt; vx *= 3.6; vy *= 3.6; }
        else if (e.dashCd <= 0 && d < 380) { e.dash = 0.35; e.dashCd = rand(2.5, 4); }
      }
      e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
      const decay = Math.max(0, 1 - 9 * dt); e.kx *= decay; e.ky *= decay;
      e.x = clamp(e.x, e.r, ARENA - e.r); e.y = clamp(e.y, e.r, ARENA - e.r);
      e.dir = Math.atan2(dy, dx);
      e.flash -= dt; e.orbitCd -= dt;
      if (d < e.r + P.r) hurtPlayer(e.dmg);
    }
    if (state !== 'play') return;
    buildGrid();
    for (const a of grid.values()) {
      for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
        const p = a[i], q = a[j], dx = q.x - p.x, dy = q.y - p.y, rr = p.r + q.r, d2 = dx * dx + dy * dy;
        if (d2 > 0.01 && d2 < rr * rr) {
          const d = Math.sqrt(d2), push = (rr - d) / 2 / d;
          const wp = p.type === 'boss' ? 0.1 : 1, wq = q.type === 'boss' ? 0.1 : 1;
          p.x -= dx * push * wp; p.y -= dy * push * wp; q.x += dx * push * wq; q.y += dy * push * wq;
        }
      }
    }

    updateWeapons(dt);
    ambientCries(dt);

    for (const sh of shots) {
      sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.life -= dt; sh.rot += dt * 20;
      near(sh.x, sh.y, 10, e => {
        if (sh.pierce <= 0 || sh.hit.has(e)) return;
        if (Math.hypot(e.x - sh.x, e.y - sh.y) < e.r + 7) {
          sh.hit.add(e); sh.pierce--;
          hit(e, sh.dmg, sh.vx * 0.35, sh.vy * 0.35, '#d9e2ef');
          if (sh.pierce <= 0) return false;
        }
      });
    }
    shots = shots.filter(sh => sh.life > 0 && sh.pierce > 0);

    for (const f of foes) {
      f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
      if (Math.hypot(f.x - P.x, f.y - P.y) < P.r + 5) { hurtPlayer(f.dmg); f.life = 0; }
    }
    foes = foes.filter(f => f.life > 0);

    for (const p of pools) {
      p.life -= dt; p.tick -= dt;
      if (p.tick <= 0) {
        p.tick = 0.3;
        near(p.x, p.y, p.r, e => { if (Math.hypot(e.x - p.x, e.y - p.y) < p.r + e.r * 0.5) hit(e, p.dmg * 0.3, 0, 0, '#ff9a3c'); });
      }
    }
    pools = pools.filter(p => p.life > 0);

    enemies = enemies.filter(e => !e.dead);

    for (const g of gems) {
      const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
      if (!g.mag && d < P.magnet) g.mag = true;
      if (g.mag) { g.sp = (g.sp || 120) + 900 * dt; g.x += dx / d * g.sp * dt; g.y += dy / d * g.sp * dt; }
      if (d < P.r + 6) {
        g.got = true;
        if (g.heal) { const h = P.maxHp * g.heal; P.hp = Math.min(P.maxHp, P.hp + h); texts.push({ x: P.x, y: P.y - 20, t: '+' + fmtN(h), life: 0.9, color: '#9be08a' }); sfx.heal(); }
        else if (g.coin) { run.gold += g.v * run.st.gold; sfx.coin(); }
        else { gainXp(g.v * run.st.xp); sfx.gem(); }
      }
    }
    gems = gems.filter(g => !g.got);

  function gainXp(v) {

  /* ---------- Montée de niveau en combat ---------- */
  let choices = [];

    for (const id in WEAPONS) { const l = P.weapons[id]?.l || 0; if (l < 5) pool.push({ kind: 'w', id, next: l + 1, w: l === 0 ? 1.3 : 1 }); }
    for (const id in PASSIVES) { const l = P.passives[id] || 0; if (l < 5) pool.push({ kind: 'p', id, next: l + 1, w: 0.8 }); }
    const out = [];
    while (out.length < 3 && pool.length) {
      let sm = 0; for (const c of pool) sm += c.w;
      let r = Math.random() * sm, k = 0;
      for (; k < pool.length - 1; k++) if ((r -= pool[k].w) < 0) break;

      else if (c.kind === 'p') { const Q = PASSIVES[c.id]; name = Q.name; desc = Q.d; icon = ICONS[c.id]; color = Q.color; tag = c.next === 1 ? 'Nouveau' : 'Niv. ' + c.next; }
      else if (c.kind === 'heal') { name = 'Onigiri'; desc = 'Soigne 50 % des PV.'; icon = ICONS.heal; color = '#f6efe2'; }
      else { name = 'Bourse de ryō'; desc = 'Ajoute des ryō à ton butin.'; icon = ICONS.shop; color = '#ffd166'; }
      const b = document.createElement('button');

      b.innerHTML = `<div class="ic">${icon}</div><b>${name}${tag ? `<small>${tag}</small>` : ''}</b><span>${desc}</span><kbd>Touche ${i + 1}</kbd>`;

      if (c.id === 'magnet') P.magnet *= 1.35;

  function shadow(x, y, r) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.85, r * 0.95, r * 0.35, 0, 0, TAU); ctx.fill(); }

  function updateParts(t) {

    if (state === 'over' || state === 'hub') return;

    ['levelScreen', 'pauseScreen'].forEach(id => $(id).hidden = true);
    const s = run.stage;
    let ryo = Math.round(run.gold), jade = run.jade, notes = [];
    if (run.endless) {
      jade += Math.floor(time / 60);
      if (time > save.endless) { save.endless = time; notes.push('Nouveau record de la Nuit sans fin !'); }
    } else if (win) {
      const bonus = Math.round(80 * Math.pow(1.16, s - 1) * run.st.gold);
      const first = !save.cleared[s];
      ryo += first ? bonus * 2 : bonus;
      if (first) {
        jade += 2 + Math.floor(s / 5) + (s % 10 === 0 ? 10 : 0);
        save.cleared[s] = 1;
        const before = save.max;
        save.max = Math.max(save.max, Math.min(STAGES, s + 1));
        notes.push('Première victoire : récompense doublée.');
        if (s === 10 || s === 25) notes.push('Nouvel emplacement d’atout débloqué !');
        const newItems = [...ARMS, ...ARMORS, ...CHARMS].filter(it => it.unlock > before && it.unlock <= save.max).map(it => it.name);
        if (newItems.length) notes.push('Nouveau à la boutique : ' + newItems.join(', ') + '.');
        if (s % 10 === 0 && s < STAGES) notes.push(`Nouvelle région : ${zoneOf(s + 1).name} !`);
        if (s === STAGES) notes.push('Tu as conquis le Mont des Démons. La Nuit sans fin t’attend.');
      } else if (s % 5 === 0) jade += 1 + Math.floor(s / 10);
    }
    save.ryo += ryo; save.jade += jade; save.runs++; save.kills += kills;
    persist();

    $('endTitle').textContent = win ? (run.endless ? 'L’aube se lève' : 'Victoire !') : (run.endless ? 'La nuit t’a englouti' : 'Tu es tombé…');

    btns.push(`<button class="btn ${!run.endless && win && s < STAGES ? 'ghost' : ''}" data-end="again">Rejouer</button>`);

    $('endBtns').innerHTML = btns.join('');
    $('endScreen').hidden = false;
    if (win) sfx.level();
    $('endBtns').firstChild.focus({ preventScroll: true });

    if (a === 'play') { startRun(+b.dataset.s); return; }

    else if (a === 'equipc') { const i = save.equip.findIndex((x, j) => !x && j < slotsOpen()); if (i < 0) { sfx.no(); toast('Tous tes emplacements sont pris. Retire d’abord un atout.'); return; } save.equip[i] = id; }
    else if (a === 'unequipc') { save.equip = save.equip.map(x => x === id ? null : x); }
    else if (a === 'dojo') { const d = DOJO.find(x => x.id === id), l = D(id); if (l >= d.max) return; if (!pay(dojoCost(d, l))) return; save.dojo[id] = l + 1; sfx.gem(); }
    else if (a === 'buyskin') { const s = SKIN[id]; if (!pay(s.ryo, s.jade)) return; save.skins.push(id); save.skin = id; sfx.buy(); toast(`Skin ${s.name} débloqué !`); }
    else if (a === 'skin') { save.skin = id; }
    else if (a === 'mute') { save.mute = !save.mute; }
    else if (a === 'copy') {
      const ta = $('saveOut');
      const done = () => toast('Code copié.');
      const fallback = () => { ta.focus(); ta.select(); toast('Sélectionne et copie le code.'); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch { fallback(); }
      return;
    }
    else if (a === 'import') {
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob($('saveIn').value.trim()))));
        if (!data || data.v !== 2 || typeof data.ryo !== 'number') throw 0;
        save = Object.assign(freshSave(), data); toast('Sauvegarde chargée.');
      } catch { sfx.no(); toast('Ce code n’est pas valide.'); return; }
    }
    else if (a === 'reset') {
      if (!resetArmed) { resetArmed = true; b.textContent = 'Confirmer : tout effacer'; b.classList.remove('ghost'); setTimeout(() => { resetArmed = false; if (b.isConnected) { b.textContent = 'Tout effacer'; b.classList.add('ghost'); } }, 4000); return; }
      resetArmed = false; save = freshSave(); toast('Progression effacée.');
    }
    persist();
    const y = $('hub').scrollTop;
    renderHub();
    $('hub').scrollTop = y;
  });

  /* ================= Pause ================= */
  function pause() {
    if (state !== 'play') return;
    state = 'pause'; windStop(); keys.clear(); joy.active = false; $('joy').hidden = true;
    $('pauseStats').innerHTML = statsHtml() + `<div><small>Ryō</small><strong><span class="coin"></span>${fmtN(run.gold)}</strong></div>`;
    $('muteBtn').textContent = save.mute ? 'Son : coupé' : 'Son : activé';
    $('pauseScreen').hidden = false;
    $('resumeBtn').focus({ preventScroll: true });
  }
  function resume() {
    if (state !== 'pause') return;
    $('pauseScreen').hidden = true; state = 'play'; last = performance.now(); windStart();
  }
  $('resumeBtn').addEventListener('click', resume);
  $('quitBtn').addEventListener('click', () => { $('pauseScreen').hidden = true; state = 'play'; endRun(false); });
  $('pauseBtn').addEventListener('click', () => state === 'play' ? pause() : resume());
  $('muteBtn').addEventListener('click', () => { save.mute = !save.mute; if (save.mute) windStop(); persist(); $('muteBtn').textContent = save.mute ? 'Son : coupé' : 'Son : activé'; });

  /* ================= Contrôles ================= */
  const keys = new Set();
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', KeyZ: 'up', ArrowDown: 'down', KeyS: 'down' };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); if (state === 'play') e.preventDefault(); }
    if (e.code === 'Escape' || e.code === 'KeyP') { state === 'play' ? pause() : state === 'pause' && resume(); }
    if (state === 'levelup' && /^Digit[1-3]$|^Numpad[1-3]$/.test(e.code)) choose(+e.code.slice(-1) - 1);
  });
  addEventListener('keyup', e => { if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]); });
  addEventListener('blur', () => { keys.clear(); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  const joy = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
  cvs.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    audio();
    joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
    const r = cvs.getBoundingClientRect(), j = $('joy');
    j.style.left = (e.clientX - r.left) + 'px'; j.style.top = (e.clientY - r.top) + 'px'; j.hidden = false;
    $('knob').style.transform = '';
    cvs.setPointerCapture?.(e.pointerId);
  });
  cvs.addEventListener('pointermove', e => {
    if (!joy.active || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
    const d = Math.hypot(dx, dy), max = 44;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    joy.dx = d < 6 ? 0 : dx / max; joy.dy = d < 6 ? 0 : dy / max;
    $('knob').style.transform = `translate(${dx}px, ${dy}px)`;
  });
  const endJoy = e => { if (e.pointerId !== joy.id) return; joy.active = false; joy.dx = joy.dy = 0; $('joy').hidden = true; };
  cvs.addEventListener('pointerup', endJoy);
  cvs.addEventListener('pointercancel', endJoy);

  /* ================= Démarrage ================= */
  let last = performance.now();
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
    if (state === 'play') { update(dt); if (state === 'play' || state === 'levelup') updateHud(); }
    else if (state === 'hub') {
      for (const e of enemies) { e.ph += dt; e.x += Math.cos(e.ph * 0.7) * 20 * dt; e.y += Math.sin(e.ph * 0.5) * 20 * dt; }
    }
    render(now);
    requestAnimationFrame(frame);
  }
  openHub();
  requestAnimationFrame(frame);
})();
</script>
