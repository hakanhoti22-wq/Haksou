<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee5">
<title>Prendre rendez-vous</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<style>
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px);max-width:620px;margin:0 auto}
header{text-align:center;padding:14px 0 6px}
header .logo{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto 14px}
header h1{font-size:32px}
.infos{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.infos a{text-decoration:none;color:var(--mut);letter-spacing:.02em}
.steps{display:flex;gap:6px;margin:18px 0 8px}
.steps div{flex:1;text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line)}
.steps div.on{color:var(--pri2);border-color:var(--pri);border-bottom-width:2px}
.srv{display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:border-color .15s,background .15s}
.srv.on{border-color:var(--pri);background:#fffdf9}
.srv .tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;color:#f7f1e8;font-size:12px;margin-top:3px}
.srv.on .tick{background:var(--pri);border-color:var(--pri)}
.srv .prix{font-family:var(--serif);font-size:17px;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(244,238,229,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:50}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:12px;align-items:center}
.day{display:flex;flex-direction:column;align-items:center;width:60px;padding:10px 0;border-radius:var(--r)}
.day small{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.75}
.day b{font-size:22px;font-family:var(--serif);font-weight:400}
.day:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:transparent;color:var(--txt);border:1px solid var(--line);min-height:44px;padding:8px 0;font-size:15px;letter-spacing:.04em;font-weight:500}
.slot.on{background:var(--pri);color:#f7f1e8;border-color:var(--pri)}
.recap div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.recap div:last-child{border:0}
.big-ok{font-size:34px;text-align:center;margin:6px 0;color:var(--gold)}
</style>
</head>
<body>
<div id="demo" class="banner hide"><b>Mode démo</b> : les réservations sont enregistrées seulement dans ce navigateur.</div>

<header>
  <img class="logo" src="icon.svg" alt="">
  <h1 class="brand" id="nom">…</h1>
  <div class="rule"></div><div class="mut" id="slogan"></div>
  <div class="infos" id="infos"></div>
</header>

<div id="loading" class="empty">Chargement…</div>
<div id="err" class="card hide" style="border-color:var(--ko)"></div>

<main id="app" class="hide">
  <div class="steps" id="steps"><div data-s="1">1. Prestations</div><div data-s="2">2. Date & heure</div><div data-s="3">3. Mes infos</div></div>

  <section id="s1">
    <div id="srvList"></div>
  </section>

  <section id="s2" class="hide">
    <h2>Choisis un jour</h2>
    <div class="chips" id="days"></div>
    <div id="slotBox"></div>
  </section>

  <section id="s3" class="hide">
    <div class="card recap" id="recap"></div>
    <div class="card">
      <label for="fNom">Prénom et nom *</label>
      <input id="fNom" autocomplete="name" placeholder="Ex. Sarah Martin">
      <label for="fTel">Téléphone *</label>
      <input id="fTel" type="tel" autocomplete="tel" placeholder="079 123 45 67">
      <label for="fMail">E-mail (pour recevoir la confirmation)</label>
      <input id="fMail" type="email" autocomplete="email" placeholder="facultatif">
      <label for="fNote">Un message ? (forme, couleur, inspiration…)</label>
      <textarea id="fNote" placeholder="Ex. amande, nude avec french fine"></textarea>
      <div id="msgBox" class="mut small" style="margin-top:12px"></div>
      <label class="check"><input type="checkbox" id="fOk"> J'ai lu les informations ci-dessus</label>
    </div>
  </section>

  <section id="done" class="hide"></section>
</main>

<section id="manage" class="hide"></section>

<div class="bar hide" id="bar"><div class="in">
  <button class="light sm" id="back" style="min-height:46px">←</button>
  <div class="grow"><div id="barTxt" style="font-weight:700"></div><div id="barSub" class="mut small"></div></div>
  <button id="next">Continuer</button>
</div></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const P = new URLSearchParams(location.search);
const api = new O.Api(window.ONGLES_API || P.get('api') || localStorage.getItem('ongles-url') || '');
const $ = id => document.getElementById(id);
let D = null, sel = [], date = '', heure = '', step = 1;

const cfg = () => D.config;
const chosen = () => sel.map(id => D.services.find(s => s.id === id)).filter(Boolean);
const duree = () => chosen().reduce((a, s) => a + Number(s.duree), 0);
const prix = () => chosen().reduce((a, s) => a + Number(s.prix), 0);

function header() {
  const c = cfg();
  document.title = c.nom + ' · Rendez-vous';
  $('nom').textContent = c.nom; $('slogan').textContent = c.slogan || '';
  const ig = String(c.instagram || '').replace(/^@/, '');
  $('infos').innerHTML = [
    c.adresse && `<a href="https://maps.google.com/?q=${encodeURIComponent(c.adresse)}" target="_blank">${O.esc(c.adresse)}</a>`,
    ig && `<a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank">@${O.esc(ig)}</a>`,
    c.telephone && `<a href="tel:${O.normTel(c.telephone)}">${O.esc(c.telephone)}</a>`
  ].filter(Boolean).join('');
}

function renderServices() {
  const cats = [];
  D.services.forEach(s => { const c = s.categorie || 'Prestations'; if (!cats.includes(c)) cats.push(c); });
  $('srvList').innerHTML = cats.map(c => `<h2>${O.esc(c)}</h2>` + D.services.filter(s => (s.categorie || 'Prestations') === c).map(s => `
    <div class="card srv ${sel.includes(s.id) ? 'on' : ''}" data-id="${s.id}">
      <div class="tick">${sel.includes(s.id) ? '✓' : ''}</div>
      <div class="grow">
        <div class="between"><b>${O.esc(s.nom)}</b><span class="prix">${O.fmtPrix(s.prix, cfg())}</span></div>
        <div class="mut">${O.fmtDur(s.duree)}${s.description ? ' · ' + O.esc(s.description) : ''}</div>
      </div>
    </div>`).join('')).join('') || '<div class="empty">Aucune prestation pour le moment.</div>';
  document.querySelectorAll('.srv').forEach(el => el.onclick = () => {
    const id = el.dataset.id;
    sel = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id];
    heure = ''; renderServices(); bar();
  });
}

const slotsFor = d => O.slots(cfg(), D.busy, d, duree(), D.today, D.nowMin);

function renderDays() {
  const n = Number(cfg().joursMax) || 45, out = [];
  let first = '';
  for (let i = 0; i <= n; i++) {
    const d = O.addDays(D.today, i), ok = slotsFor(d).length > 0, dt = O.parse(d);
    if (ok && !first) first = d;
    out.push(`<button class="chip day ${d === date ? 'on' : ''}" data-d="${d}" ${ok ? '' : 'disabled'}>
      <small>${O.JOURS[dt.getDay()].slice(0, 3)}</small><b>${dt.getDate()}</b><small>${O.MOIS_C[dt.getMonth()]}</small></button>`);
  }
  if (!date || !slotsFor(date).length) date = first;
  $('days').innerHTML = out.join('');
  document.querySelectorAll('.day').forEach(b => { b.classList.toggle('on', b.dataset.d === date); b.onclick = () => { date = b.dataset.d; heure = ''; renderDays(); bar(); }; });
  const on = document.querySelector('.day.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  renderSlots();
}

function renderSlots() {
  if (!date) { $('slotBox').innerHTML = '<div class="card empty"><span class="e"></span>Plus aucun créneau disponible pour cette durée. Contacte-moi directement !</div>'; return; }
  const s = slotsFor(date);
  const grp = [['Matin', s.filter(t => t < '12:00')], ['Après-midi', s.filter(t => t >= '12:00' && t < '18:00')], ['Soir', s.filter(t => t >= '18:00')]].filter(g => g[1].length);
  $('slotBox').innerHTML = `<h2>${O.cap(O.fmtDate(date))}</h2>` + grp.map(([n, l]) => `<div class="mut small" style="margin:10px 0 6px">${n}</div><div class="slots">${l.map(t => `<button class="slot ${t === heure ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')}</div>`).join('');
  document.querySelectorAll('.slot').forEach(b => b.onclick = () => { heure = b.dataset.t; renderSlots(); bar(); });
}

function recap() {
  const c = cfg();
  $('recap').innerHTML = `<h3>Ton rendez-vous</h3>
    <div><span>${O.cap(O.fmtDate(date))}</span><b>${heure} – ${O.toHM(O.toMin(heure) + duree())}</b></div>
    ${chosen().map(s => `<div><span>${O.esc(s.nom)}</span><span>${O.fmtPrix(s.prix, c)}</span></div>`).join('')}
    <div><span>Total · ${O.fmtDur(duree())}</span><b>${O.fmtPrix(prix(), c)}</b></div>`;
  $('msgBox').innerHTML = c.message ? 'ℹ️ ' + O.esc(c.message) : '';
  $('fOk').closest('.check').classList.toggle('hide', !c.message);
}

function bar() {
  const n = sel.length;
  $('bar').classList.toggle('hide', step > 3 || (step === 1 && !n));
  $('back').classList.toggle('hide', step === 1);
  if (step === 1) {
    $('barTxt').textContent = n + ' prestation' + (n > 1 ? 's' : '') + ' · ' + O.fmtPrix(prix(), cfg());
    $('barSub').textContent = '' + O.fmtDur(duree());
    $('next').textContent = 'Choisir la date'; $('next').disabled = !n;
  } else if (step === 2) {
    $('barTxt').textContent = heure ? O.cap(O.fmtDay(date)) + ' à ' + heure : 'Choisis un horaire';
    $('barSub').textContent = O.fmtDur(duree()) + ' · ' + O.fmtPrix(prix(), cfg());
    $('next').textContent = 'Continuer'; $('next').disabled = !heure;
  } else {
    $('barTxt').textContent = O.fmtPrix(prix(), cfg());
    $('barSub').textContent = 'Paiement sur place';
    $('next').textContent = 'Réserver'; $('next').disabled = false;
  }
}

function go(s) {
  step = s;
  ['s1', 's2', 's3'].forEach((id, i) => $(id).classList.toggle('hide', i + 1 !== s));
  document.querySelectorAll('#steps div').forEach(d => d.classList.toggle('on', Number(d.dataset.s) <= s));
  if (s === 2) renderDays();
  if (s === 3) { recap(); const m = JSON.parse(localStorage.getItem('ongles-moi') || '{}'); ['fNom', 'fTel', 'fMail'].forEach(k => { if (!$(k).value && m[k]) $(k).value = m[k]; }); }
  bar(); scrollTo({ top: 0, behavior: 'smooth' });
}

$('back').onclick = () => go(step - 1);
$('next').onclick = async () => {
  if (step < 3) return go(step + 1);
  const nom = $('fNom').value.trim(), tel = $('fTel').value.trim();
  if (!nom) return O.toast('Indique ton prénom et ton nom');
  if (O.normTel(tel).length < 8) return O.toast('Indique un numéro de téléphone valide');
  if (cfg().message && !$('fOk').checked) return O.toast('Coche la case « J\'ai lu les informations »');
  $('next').disabled = true; $('next').textContent = 'Envoi…';
  try {
    const page = location.origin + location.pathname;
    const r = await api.call('book', { services: sel, date, debut: heure, nom, tel, email: $('fMail').value.trim(), note: $('fNote').value.trim(), page });
    localStorage.setItem('ongles-moi', JSON.stringify({ fNom: nom, fTel: tel, fMail: $('fMail').value.trim() }));
    done(r.rdv);
  } catch (e) {
    O.toast(e.message, 4000);
    if (/créneau/.test(e.message)) { await load(); heure = ''; go(2); } else bar();
  }
};

function done(r) {
  step = 4; bar();
  ['s1', 's2', 's3'].forEach(id => $(id).classList.add('hide')); $('steps').classList.add('hide');
  const att = r.statut === 'attente', c = cfg();
  $('done').classList.remove('hide');
  $('done').innerHTML = `<div class="card center">
      <div class="big-ok">${att ? '◷' : '✦'}</div>
      <h3>${att ? 'Demande envoyée !' : 'Rendez-vous confirmé !'}</h3>
      <p class="mut">${att ? 'Je te confirme ton rendez-vous très vite.' : 'Merci ' + O.esc(r.nom.split(' ')[0]) + ', à bientôt'}</p>
    </div>
    <div class="card recap">
      <div><span>${O.cap(O.fmtDate(r.date))}</span><b>${r.debut} – ${r.fin}</b></div>
      <div><span>${O.esc(r.prestations)}</span><b>${O.fmtPrix(r.prix, c)}</b></div>
      ${c.adresse ? `<div><span>${O.esc(c.adresse)}</span></div>` : ''}
      <div><span>Code de réservation</span><b style="letter-spacing:.1em">${r.code}</b></div>
    </div>
    <button class="full" id="ics">Ajouter à mon agenda</button>
    <p class="mut small center" style="margin-top:14px">Pour annuler : <a href="?code=${r.code}">${O.esc(location.host + location.pathname)}?code=${r.code}</a></p>
    <button class="light full" style="margin-top:8px" onclick="location.href=location.pathname">Prendre un autre rendez-vous</button>`;
  $('ics').onclick = () => O.download('rendez-vous-ongles.ics', O.ics(r, c));
  scrollTo({ top: 0 });
}

async function manage(code) {
  $('loading').classList.add('hide'); $('app').classList.add('hide');
  const m = $('manage'); m.classList.remove('hide');
  try {
    const j = await api.call('lookup', { code });
    D = { config: O.withDefaults(j.config) }; header();
    const r = j.rdv, c = cfg(), ann = r.statut === 'annule';
    m.innerHTML = `<h2>Mon rendez-vous</h2><div class="card recap">
        <div><span>${O.cap(O.fmtDate(r.date))}</span><b>${r.debut} – ${r.fin}</b></div>
        <div><span>${O.esc(r.prestations)}</span><b>${O.fmtPrix(r.prix, c)}</b></div>
        <div><span>Statut</span><span class="pill ${r.statut}">${O.STATUTS[r.statut] || r.statut}</span></div>
      </div>
      ${ann ? '' : j.canCancel ? '<button class="red full" id="cancel">Annuler mon rendez-vous</button>'
        : `<div class="card mut">Il est trop tard pour annuler en ligne (moins de ${c.annulationH} h avant). Contacte-moi directement${c.telephone ? ' au <a href="tel:' + O.normTel(c.telephone) + '">' + O.esc(c.telephone) + '</a>' : ''}.</div>`}
      <button class="light full" style="margin-top:10px" onclick="location.href=location.pathname">Prendre un rendez-vous</button>`;
    const b = $('cancel');
    if (b) b.onclick = async () => {
      if (!confirm('Annuler ce rendez-vous ?')) return;
      b.disabled = true;
      try { await api.call('cancel', { code }); O.toast('Rendez-vous annulé'); manage(code); } catch (e) { O.toast(e.message, 4000); b.disabled = false; }
    };
  } catch (e) { m.innerHTML = `<div class="card">${O.esc(e.message)}</div><button class="full" onclick="location.href=location.pathname">Prendre un rendez-vous</button>`; }
}

async function load() {
  const j = await api.call('public');
  D = { config: O.withDefaults(j.config), services: j.services, busy: j.busy, today: j.today || O.today(), nowMin: j.nowMin != null ? j.nowMin : O.nowMin() };
  sel = sel.filter(id => D.services.some(s => s.id === id));
}

(async () => {
  $('demo').classList.toggle('hide', !api.demo);
  if (P.get('code')) return manage(P.get('code'));
  try {
    await load(); header(); renderServices();
    $('loading').classList.add('hide'); $('app').classList.remove('hide'); go(1);
  } catch (e) {
    $('loading').classList.add('hide');
    $('err').classList.remove('hide'); $('err').innerHTML = 'Impossible de charger les disponibilités.<br><span class="mut">' + O.esc(e.message) + '</span>';
  }
})();
</script>
</body>
</html>
