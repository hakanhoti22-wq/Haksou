<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Studio">
<meta name="theme-color" content="#fbf4f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Mon Studio 💅</title>
<style>
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:100}
nav button{background:none;color:var(--mut);flex:1;flex-direction:column;gap:1px;font-size:11px;padding:4px 0;min-height:50px;font-weight:600;position:relative}
nav button span{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--pri2)}
nav button.on span{filter:none;opacity:1}
nav .badge{position:absolute;top:2px;left:55%;background:var(--ko);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat .num{font-size:18px}
.stat .mut{font-size:12px}
.tl{display:flex;gap:12px;align-items:stretch;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tl:last-child{border:0}
.tl .h{width:48px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.tl .h small{display:block;font-weight:500;color:var(--mut)}
.tl .b{width:4px;border-radius:9px;background:var(--info);flex:none}
.tl .b.attente{background:var(--warn)}.tl .b.encours{background:var(--pri)}.tl .b.termine{background:var(--ok)}.tl .b.absente{background:var(--ko)}
.gap{font-size:13px;color:var(--ok);padding:6px 0 6px 60px;border-bottom:1px solid var(--line)}
.now{border:2px solid var(--pri);background:linear-gradient(180deg,#fff,#fff7f9)}
.prog{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .5s}
.prog.over i{background:var(--warn)}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.task{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.task .x{background:none;color:var(--mut);min-height:30px;padding:0 6px;font-size:18px}
.menu .item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.menu .item:last-child{border:0}
.menu .item span:first-child{font-size:22px;width:30px;text-align:center}
.menu .item::after{content:'›';margin-left:auto;color:var(--mut);font-size:22px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 22px rgba(194,87,122,.4);z-index:90;padding:0}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lrow:last-child{border:0}
.hbar{height:8px;border-radius:9px;background:var(--pri);opacity:.75}
.dayrow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border:0}
.dayrow .hp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.dayrow input[type=time]{padding:8px 6px;font-size:15px;min-width:0}
.cli{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--pri2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
#login{max-width:460px;margin:30px auto}
</style>
</head>
<body>
<div id="demo" class="banner hide">🧪 <b>Mode démo</b> : données fictives, enregistrées seulement sur ce téléphone. Connecte ta Google Sheet dans <b>Plus → Connexion</b>.</div>
<div id="view"><div class="empty"><span class="e">💅</span>Chargement…</div></div>
<button class="fab hide" id="fab" aria-label="Nouveau rendez-vous">+</button>
<nav id="nav">
  <button data-t="jour" class="on"><span>☀️</span>Aujourd'hui</button>
  <button data-t="agenda"><span>📅</span>Agenda</button>
  <button data-t="clientes"><span>👩</span>Clientes</button>
  <button data-t="taches"><span>✅</span>Tâches</button>
  <button data-t="plus"><span>⚙️</span>Plus</button>
</nav>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const E = O.esc;
let api, S = null, tab = 'jour', sub = null, weekStart = null, statMonth = O.today().slice(0, 7), q = '';

const cfg = () => S.config;
const live = r => r.statut !== 'annule';
const byTime = (a, b) => (a.date + a.debut).localeCompare(b.date + b.debut);
const dayRdv = d => S.rdv.filter(r => r.date === d && live(r)).sort(byTime);
const prenom = n => String(n || '').trim().split(/\s+/)[0];
const ckey = t => O.intl(t, cfg().indicatif);
const nowHM = () => O.toHM(O.nowMin());
const P = v => O.fmtPrix(v, cfg());
const find = id => S.rdv.find(r => r.id === id);
const pill = s => `<span class="pill ${s}">${O.STATUTS[s] || s}</span>`;
const stat = (v, l) => `<div class="stat"><div class="num">${v}</div><div class="mut">${l}</div></div>`;
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Bonjour ☀️' : h < 18 ? 'Bon après-midi 🌸' : 'Bonsoir 🌙'; };
const safe = fn => async (...a) => { try { return await fn(...a); } catch (e) { O.toast('⚠️ ' + e.message, 4500); } };
const quand = d => d === O.today() ? "aujourd'hui" : d === O.addDays(O.today(), 1) ? 'demain' : 'le ' + O.fmtDate(d);

const MSG = {
  conf: r => `Bonjour ${prenom(r.nom)} 💅 Ton rendez-vous chez ${cfg().nom} est confirmé : ${O.fmtDate(r.date)} à ${r.debut} (${r.prestations}).${cfg().adresse ? ' 📍 ' + cfg().adresse : ''} À bientôt !`,
  rappel: r => `Coucou ${prenom(r.nom)} ! Petit rappel pour ton rendez-vous ${quand(r.date)} à ${r.debut} (${r.prestations}). À tout bientôt 💕`,
  refus: r => `Bonjour ${prenom(r.nom)}, désolée, je ne suis pas disponible ${quand(r.date)} à ${r.debut}. Je peux te proposer un autre créneau ? 🙏`,
  merci: r => `Merci ${prenom(r.nom)} pour ta visite 💕 J'espère que tes ongles te plaisent ! Tu peux reprendre rendez-vous ici : ${bookUrl()}`
};

/* ---------- Données ---------- */
function initApi() {
  api = new O.Api(localStorage.getItem('ongles-url') || '', localStorage.getItem('ongles-token') || '');
  $('demo').classList.toggle('hide', !api.demo);
}
async function load() {
  const j = await api.call('all');
  S = { config: O.withDefaults(j.config), services: j.services || [], taches: j.taches || [], clientes: j.clientes || {}, rdv: (j.rdv || []).map(r => Object.assign(r, { prix: Number(r.prix) || 0, duree: Number(r.duree) || 0, paye: r.paye === true || r.paye === 'true' })) };
}
const saveRdv = async (r, msg) => {
  const j = await api.call('saveRdv', { rdv: r });
  const n = Object.assign(j.rdv, { prix: Number(j.rdv.prix) || 0, duree: Number(j.rdv.duree) || 0, paye: j.rdv.paye === true || j.rdv.paye === 'true' });
  const i = S.rdv.findIndex(x => x.id === n.id);
  if (i >= 0) S.rdv[i] = n; else S.rdv.push(n);
  render(); if (msg) O.toast(msg);
  return n;
};
const saveCfg = async msg => { await api.call('saveConfig', { config: S.config }); O.toast(msg || 'Enregistré ✅'); render(); };
const saveSrv = async () => { await api.call('saveServices', { services: S.services }); O.toast('Prestations enregistrées ✅'); };
const saveTaches = async () => { await api.call('saveTaches', { taches: S.taches }); };
const bookUrl = () => {
  const base = location.href.replace(/[^/]*([?#].*)?$/, '');
  const url = localStorage.getItem('ongles-url') || '';
  return base + (url && url !== window.ONGLES_API ? '?api=' + encodeURIComponent(url) : '');
};

/* ---------- Fenêtre du bas ---------- */
function sheet(html) {
  closeSheet();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  m.onclick = e => { if (e.target === m) closeSheet(); };
  document.body.appendChild(m); document.body.style.overflow = 'hidden';
  return m;
}
function closeSheet() { const m = $('modal'); if (m) m.remove(); document.body.style.overflow = ''; }
function notify(r, msg, titre) {
  if (!r.tel) return;
  sheet(`<h3>${titre}</h3><p class="mut">Prévenir ${E(prenom(r.nom))} :</p>
    <div class="card small">${E(msg)}</div>
    <div class="grid2"><a class="btn green" target="_blank" href="${O.whatsapp(r.tel, msg, cfg().indicatif)}" onclick="closeSheet()">💬 WhatsApp</a>
    <a class="btn ghost" href="${O.sms(r.tel, msg)}" onclick="closeSheet()">✉️ SMS</a></div>
    <button class="light full" style="margin-top:10px" onclick="closeSheet()">Plus tard</button>`);
}

/* ---------- Actions ---------- */
const A = {
  open: id => openRdv(id),
  start: safe(async id => {
    const enc = S.rdv.find(r => r.statut === 'encours' && r.id !== id);
    if (enc) await saveRdv(Object.assign({}, enc, { statut: 'termine', finReel: enc.finReel || nowHM() }));
    await saveRdv(Object.assign({}, find(id), { statut: 'encours', debutReel: nowHM(), finReel: '' }), '⏱ Chrono lancé');
  }),
  finish: safe(async id => {
    await saveRdv(Object.assign({}, find(id), { statut: 'termine', finReel: nowHM() }), 'Bravo ! 💅 Note le paiement');
    openRdv(id);
  }),
  confirm: safe(async id => { const r = await saveRdv(Object.assign({}, find(id), { statut: 'confirme' }), 'Rendez-vous confirmé ✅'); notify(r, MSG.conf(r), 'Confirmé ✅'); }),
  refuse: safe(async id => {
    if (!confirm('Refuser ce rendez-vous ?')) return;
    const r = await saveRdv(Object.assign({}, find(id), { statut: 'annule' }), 'Rendez-vous refusé'); notify(r, MSG.refus(r), 'Refusé');
  }),
  status: safe(async (id, s) => {
    if (s === 'annule' && !confirm('Annuler ce rendez-vous ?')) return;
    await saveRdv(Object.assign({}, find(id), { statut: s }), O.STATUTS[s]); closeSheet();
  }),
  task: safe(async id => {
    const t = S.taches.find(x => x.id === id); t.fait = !t.fait;
    if (t.fait && t.repeat && !t.suite) {
      const n = { week: 7, day: 1, month: 30 }[t.repeat] || 7;
      t.suite = true;
      S.taches.push({ id: O.uid(), texte: t.texte, fait: false, date: O.addDays(t.date || O.today(), n), repeat: t.repeat });
    }
    render(); await saveTaches();
  }),
  delTask: safe(async id => { S.taches = S.taches.filter(x => x.id !== id); render(); await saveTaches(); })
};

/* ---------- Aujourd'hui ---------- */
function vJour() {
  const t = O.today(), now = O.nowMin(), L = dayRdv(t);
  const W = L.filter(r => r.statut !== 'absente');
  const att = S.rdv.filter(r => r.statut === 'attente' && r.date >= t).sort(byTime);
  const enc = S.rdv.find(r => r.statut === 'encours');
  const next = W.find(r => ['confirme', 'attente'].includes(r.statut) && O.toMin(r.fin) > now && r !== enc);
  let h = `<div class="between"><div><div class="mut">${greet()}</div><h1 class="brand">${O.cap(O.fmtDate(t))}</h1></div><button class="icon ghost" onclick="refresh()" aria-label="Actualiser">↻</button></div>
    <div class="grid3" style="margin-top:14px">${stat(W.length, 'rendez-vous')}${stat(P(W.reduce((a, r) => a + r.prix, 0)), 'prévu')}${stat(O.fmtDur(W.reduce((a, r) => a + r.duree, 0)), 'de travail')}</div>`;
  if (att.length) h += `<h2>⏳ À valider (${att.length})</h2>` + att.map(r => `<div class="card">
      <div class="between"><b>${E(r.nom)}</b><span class="mut small">${O.cap(O.fmtDay(r.date))} · ${r.debut}</span></div>
      <div class="mut">${E(r.prestations)} · ${P(r.prix)}</div>${r.note ? `<div class="small" style="margin-top:4px">💬 ${E(r.note)}</div>` : ''}
      <div class="grid2" style="margin-top:10px"><button class="green sm" onclick="A.confirm('${r.id}')">✓ Accepter</button><button class="light sm" onclick="A.refuse('${r.id}')">Refuser</button></div></div>`).join('');

  h += `<h2>${enc ? '⏱ En ce moment' : 'Prochaine cliente'}</h2>`;
  if (enc) {
    const deb = O.toMin(enc.debutReel || enc.debut), ecoule = Math.max(0, now - deb), pct = Math.min(100, ecoule / enc.duree * 100);
    const finPrev = deb + enc.duree, apres = W.find(r => r.date === t && O.toMin(r.debut) >= O.toMin(enc.debut) && r !== enc && r.statut !== 'termine');
    let info = `Fin prévue à <b>${O.toHM(finPrev)}</b>`;
    if (ecoule > enc.duree) info = `⚠️ Tu dépasses de <b>${O.fmtDur(ecoule - enc.duree)}</b>`;
    if (apres) { const marge = O.toMin(apres.debut) - Math.max(finPrev, now); info += marge < 0 ? ` · <b style="color:var(--ko)">${E(prenom(apres.nom))} arrive à ${apres.debut}</b> (retard ${O.fmtDur(-marge)})` : ` · ${E(prenom(apres.nom))} à ${apres.debut}`; }
    h += `<div class="card now"><div class="between"><div><b>${E(enc.nom)}</b><div class="mut">${E(enc.prestations)}</div></div><div class="big">${O.fmtDur(ecoule)}</div></div>
      <div class="prog ${ecoule > enc.duree ? 'over' : ''}"><i style="width:${pct}%"></i></div>
      <div class="mut small">Commencé à ${enc.debutReel || enc.debut} · prévu ${O.fmtDur(enc.duree)}</div><div class="small" style="margin-top:4px">${info}</div>
      <button class="green full" style="margin-top:12px" onclick="A.finish('${enc.id}')">✅ Terminer</button></div>`;
  } else if (next) {
    const d = O.toMin(next.debut) - now;
    const dans = d > 0 ? 'dans ' + O.fmtDur(d) : d > -5 ? 'maintenant' : 'en retard de ' + O.fmtDur(-d);
    h += `<div class="card now"><div class="between"><div><b>${E(next.nom)}</b> ${pill(next.statut)}<div class="mut">${E(next.prestations)} · ${O.fmtDur(next.duree)}</div></div>
      <div class="center"><div class="big">${next.debut}</div><div class="mut small">${dans}</div></div></div>
      ${next.note ? `<div class="small" style="margin-top:6px">💬 ${E(next.note)}</div>` : ''}${notesCli(next)}
      <div class="grid2" style="margin-top:12px"><button onclick="A.start('${next.id}')">▶️ Commencer</button>
      <a class="btn ghost" target="_blank" href="${O.whatsapp(next.tel, MSG.rappel(next), cfg().indicatif)}">💬 Rappel</a></div></div>`;
  } else {
    const dem = S.rdv.filter(r => live(r) && r.date > t && ['confirme', 'attente'].includes(r.statut)).sort(byTime)[0];
    h += `<div class="card empty"><span class="e">🎉</span>Plus de rendez-vous aujourd'hui.${dem ? `<br><span class="small">Prochain : ${E(dem.nom)}, ${O.fmtDay(dem.date).toLowerCase()} à ${dem.debut}</span>` : ''}</div>`;
  }

  h += `<h2>Programme du jour</h2><div class="card">${timeline(L, t) || '<div class="empty">Aucun rendez-vous aujourd\'hui</div>'}</div>`;
  const T = S.taches.filter(x => !x.fait && x.date && x.date <= t);
  h += `<h2>✅ À faire aujourd'hui</h2>` + (T.length ? `<div class="card">${T.map(taskRow).join('')}</div>` : `<div class="card mut">Rien de prévu ✨ <a href="#" onclick="go('taches');return false">Ajouter une tâche</a></div>`);
  const tom = dayRdv(O.addDays(t, 1)).filter(r => r.tel && ['confirme', 'attente'].includes(r.statut));
  if (tom.length) h += `<h2>📲 Rappels pour demain</h2><div class="card">${tom.map(r => `<div class="between task"><div class="grow"><b>${r.debut}</b> ${E(r.nom)}</div><a class="btn sm ghost" target="_blank" href="${O.whatsapp(r.tel, MSG.rappel(r), cfg().indicatif)}">💬 Envoyer</a></div>`).join('')}</div>`;
  return h;
}
function notesCli(r) { const n = (S.clientes[ckey(r.tel)] || {}).notes; return n ? `<div class="small" style="margin-top:6px;background:var(--soft);border-radius:10px;padding:8px">📝 ${E(n)}</div>` : ''; }
function timeline(L, d) {
  const pl = (cfg().horaires[O.parse(d).getDay()] || []);
  let prev = pl.length ? O.toMin(pl[0][0]) : null, h = '';
  L.forEach(r => {
    const s = O.toMin(r.debut);
    if (prev != null && s - prev >= 30) h += `<div class="gap">🌿 Libre ${O.fmtDur(s - prev)}</div>`;
    h += `<div class="tl" onclick="A.open('${r.id}')"><div class="h">${r.debut}<small>${r.fin}</small></div><div class="b ${r.statut}"></div>
      <div class="grow"><div class="between"><b>${E(r.nom)}</b>${pill(r.statut)}</div><div class="mut small">${E(r.prestations)} · ${P(r.prix)}${r.paye ? ' · 💰 payé' : ''}</div></div></div>`;
    prev = Math.max(prev || 0, O.toMin(r.fin));
  });
  return h;
}

/* ---------- Agenda ---------- */
function monday(d) { const x = O.parse(d); const k = (x.getDay() + 6) % 7; return O.addDays(d, -k); }
function vAgenda() {
  weekStart = weekStart || monday(O.today());
  const end = O.addDays(weekStart, 6), a = O.parse(weekStart), b = O.parse(end);
  const titre = a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${O.MOIS[b.getMonth()]}` : `${a.getDate()} ${O.MOIS_C[a.getMonth()]} – ${b.getDate()} ${O.MOIS_C[b.getMonth()]}`;
  const W = S.rdv.filter(r => live(r) && r.date >= weekStart && r.date <= end && r.statut !== 'absente');
  let h = `<h1 class="brand">Agenda</h1>
    <div class="between" style="margin:12px 0"><button class="light icon" onclick="weekStart=O.addDays(weekStart,-7);render()">‹</button>
    <div class="center"><b>${titre}</b><div class="mut small">${W.length} RDV · ${P(W.reduce((s, r) => s + r.prix, 0))}</div></div>
    <button class="light icon" onclick="weekStart=O.addDays(weekStart,7);render()">›</button></div>
    ${weekStart !== monday(O.today()) ? `<button class="ghost sm full" style="margin-bottom:12px" onclick="weekStart=null;render()">Revenir à cette semaine</button>` : ''}`;
  for (let i = 0; i < 7; i++) {
    const d = O.addDays(weekStart, i), L = dayRdv(d), pl = cfg().horaires[O.parse(d).getDay()] || [];
    const ferme = O.isClosed(cfg(), d) ? '🏖 Fermé (congé)' : pl.length ? pl.map(p => p.join('–')).join(' · ') : 'Fermé';
    h += `<div class="card" ${d === O.today() ? 'style="border-color:var(--pri)"' : ''}>
      <div class="between"><div><b>${O.cap(O.fmtDate(d))}</b><div class="mut small">${ferme}</div></div><button class="ghost sm" onclick="openForm(null,'${d}')">+ RDV</button></div>
      ${L.length ? `<div style="margin-top:6px">${timeline(L, d)}</div>` : ''}</div>`;
  }
  return h;
}

/* ---------- Fiche RDV ---------- */
function openRdv(id) {
  const r = find(id); if (!r) return;
  const ind = cfg().indicatif, modes = [['especes', '💵 Espèces'], ['twint', '📱 TWINT'], ['carte', '💳 Carte'], ['virement', '🏦 Virement']];
  const act = {
    attente: `<button class="green" onclick="A.confirm('${id}')">✓ Accepter</button><button class="light" onclick="A.refuse('${id}')">Refuser</button>`,
    confirme: `<button onclick="closeSheet();A.start('${id}')">▶️ Commencer</button><button class="light" onclick="A.status('${id}','absente')">🚫 Absente</button>`,
    encours: `<button class="green" onclick="A.finish('${id}')">✅ Terminer</button><button class="light" onclick="A.status('${id}','confirme')">Annuler le chrono</button>`,
    termine: '', absente: `<button class="light" onclick="A.status('${id}','confirme')">Remettre en confirmé</button>`, annule: `<button class="light" onclick="A.status('${id}','confirme')">Rétablir</button>`
  }[r.statut] || '';
  const reel = r.debutReel && r.finReel ? O.toMin(r.finReel) - O.toMin(r.debutReel) : 0;
  const m = sheet(`<div class="between"><h3>${E(r.nom)}</h3>${pill(r.statut)}</div>
    <div class="mut">📅 ${O.cap(O.fmtDate(r.date))} · <b>${r.debut} – ${r.fin}</b></div>
    <div class="card" style="margin-top:12px"><div class="lrow"><span>${E(r.prestations)}</span><b>${P(r.prix)}</b></div>

    <button class="full" style="margin-top:14px" id="fSave">${id ? 'Enregistrer' : 'Ajouter le rendez-vous'}</button>`);

    sel = [...m.querySelectorAll('#fSrv input:checked')].map(i => i.value);

    if (fromSrv) { $('fDuree').value = ch.reduce((a, s) => a + Number(s.duree), 0) || ''; $('fPrix').value = ch.reduce((a, s) => a + Number(s.prix), 0) || ''; }
    const dur = Number($('fDuree').value) || 0, d = $('fDate').value, hh = $('fH').value;
    const others = S.rdv.filter(x => live(x) && x.id !== r.id && x.statut !== 'absente');
    const free = dur && d ? O.slots(Object.assign({}, cfg(), { delaiMin: 0, joursMax: 3650 }), others, d, dur, O.today(), d === O.today() ? O.nowMin() : 0) : [];
    $('fFree').innerHTML = dur && d ? (free.length ? `<div class="mut small">Créneaux libres :</div><div class="chips">${free.map(t => `<button class="chip ${t === hh ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')}</div>` : `<div class="mut small">Aucun créneau libre ce jour-là sur tes horaires (tu peux quand même choisir une heure).</div>`) : '';

  $('fSave').onclick = safe(async () => {
    const ch = sel.map(i => S.services.find(s => s.id === i)).filter(Boolean);
    const n = Object.assign(r, { nom: $('fNom').value.trim(), tel: $('fTel').value.trim(), email: $('fMail').value.trim(), services: sel, prestations: ch.map(s => s.nom).join(' + ') || r.prestations || 'Rendez-vous', duree: Number($('fDuree').value) || 0, prix: Number($('fPrix').value) || 0, date: $('fDate').value, debut: $('fH').value, note: $('fNote').value.trim(), statut: $('fStat').value });
    if (!n.nom) return O.toast('Indique le nom de la cliente');
    if (!n.date || !n.debut || !n.duree) return O.toast('Date, heure et durée obligatoires');
    if ($('fWarn').textContent && !confirm('Ce créneau chevauche un autre rendez-vous. Continuer ?')) return;
    await saveRdv(n, id ? 'Modifié ✅' : 'Rendez-vous ajouté ✅'); closeSheet();
  });
}

/* ---------- Clientes ---------- */
function clients() {
  const m = {}, t = O.today();
  S.rdv.slice().sort(byTime).forEach(r => {
    const k = ckey(r.tel) || 'nom:' + String(r.nom).toLowerCase(); if (!r.nom) return;
    const c = m[k] || (m[k] = { key: k, nom: r.nom, tel: r.tel, email: '', rdv: [] });
    c.rdv.push(r); c.nom = r.nom; if (r.tel) c.tel = r.tel; if (r.email) c.email = r.email;
  });
  return Object.values(m).map(c => {
    const done = c.rdv.filter(r => r.statut === 'termine');
    c.visites = done.length; c.total = done.reduce((a, r) => a + r.prix, 0);
    c.last = done.length ? done[done.length - 1].date : '';
    c.next = c.rdv.find(r => r.date >= t && ['confirme', 'attente', 'encours'].includes(r.statut));
    c.abs = c.rdv.filter(r => r.statut === 'absente').length;
    c.act = c.rdv[c.rdv.length - 1].date;
    return c;
  }).sort((a, b) => b.act.localeCompare(a.act));
}
const initiales = n => String(n).trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();

    ${L.map(c => `<div class="card cli" onclick="openClient('${E(c.key)}')"><div class="av">${E(initiales(c.nom))}</div>

const REP = { '': 'Une fois', day: 'Chaque jour', week: 'Chaque semaine', month: 'Chaque mois' };

    <div class="grow"><div class="t">${E(t.texte)}</div>${t.date || t.repeat ? `<div class="small ${late ? '' : 'mut'}" ${late ? 'style="color:var(--ko)"' : ''}>${t.date ? O.cap(O.fmtDay(t.date)) : ''}${t.repeat ? ' · 🔁 ' + REP[t.repeat].toLowerCase() : ''}</div>` : ''}</div>

}
function vTaches() {
  const t = O.today(), T = S.taches, open = T.filter(x => !x.fait);
  const grp = [['🔥 En retard', open.filter(x => x.date && x.date < t)], ["Aujourd'hui", open.filter(x => x.date === t)], ['À venir', open.filter(x => x.date > t).sort((a, b) => a.date.localeCompare(b.date))], ['Quand j\'ai le temps', open.filter(x => !x.date)]];

    ${done.length ? `<h2>Faites</h2><div class="card">${done.map(taskRow).join('')}</div>` : ''}`;
}
function bindTaches() {
  const add = safe(async () => {

function vStats() {
  const mo = statMonth, [y, m] = mo.split('-').map(Number), M = S.rdv.filter(r => r.date.startsWith(mo));
  const ok = M.filter(r => r.statut === 'termine'), abs = M.filter(r => r.statut === 'absente'), ann = M.filter(r => r.statut === 'annule');
  const prevu = M.filter(r => ['confirme', 'attente', 'encours'].includes(r.statut));
  const enc = M.filter(r => r.paye).reduce((a, r) => a + r.prix, 0), real = ok.reduce((a, r) => a + r.prix, 0);
  const first = {}; S.rdv.filter(r => r.statut === 'termine').sort(byTime).forEach(r => { const k = ckey(r.tel) || r.nom; if (!first[k]) first[k] = r.date; });
  const nouv = Object.values(first).filter(d => d.startsWith(mo)).length;
  const top = {}; ok.forEach(r => (r.prestations || '').split(' + ').forEach(p => top[p] = (top[p] || 0) + 1));
  const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 6), mx = topL.length ? topL[0][1] : 1;
  const modes = {}; M.filter(r => r.paye).forEach(r => { const k = r.modePaiement || 'autre'; modes[k] = (modes[k] || 0) + r.prix; });
  const dur = {}; S.rdv.filter(r => r.statut === 'termine' && r.debutReel && r.finReel).forEach(r => { const d = O.toMin(r.finReel) - O.toMin(r.debutReel); if (d <= 0) return; const k = r.prestations; (dur[k] = dur[k] || { n: 0, s: 0, p: r.duree }).n++; dur[k].s += d; });
  const prev = O.ymd(new Date(y, m - 2, 1)).slice(0, 7), nxt = O.ymd(new Date(y, m, 1)).slice(0, 7);
  return `<div class="between" style="margin:12px 0"><button class="light icon" onclick="statMonth='${prev}';render()">‹</button><b>${O.cap(O.MOIS[m - 1])} ${y}</b><button class="light icon" onclick="statMonth='${nxt}';render()">›</button></div>
    <div class="grid2">${stat(P(enc), '💰 encaissé')}${stat(P(real), '💅 réalisé')}${stat(ok.length, 'RDV terminés')}${stat(P(prevu.reduce((a, r) => a + r.prix, 0)), '📅 encore prévu')}
      ${stat(ok.length ? P(Math.round(real / ok.length)) : '–', 'panier moyen')}${stat(nouv, '🌸 nouvelles clientes')}
      ${stat(abs.length, '🚫 absences')}${stat(ann.length, 'annulations')}</div>
    <h2>Prestations les plus demandées</h2><div class="card">${topL.map(([n, c]) => `<div style="margin:6px 0"><div class="between small"><span>${E(n)}</span><b>${c}</b></div><div class="hbar" style="width:${c / mx * 100}%"></div></div>`).join('') || '<div class="mut">Pas encore de données</div>'}</div>
    <h2>Moyens de paiement</h2><div class="card">${Object.entries(modes).map(([k, v]) => `<div class="lrow"><span>${({ especes: '💵 Espèces', twint: '📱 TWINT', carte: '💳 Carte', virement: '🏦 Virement' })[k] || 'Autre'}</span><b>${P(v)}</b></div>`).join('') || '<div class="mut">Aucun paiement noté</div>'}</div>
    <h2>⏱ Durée réelle vs prévue</h2><div class="card">${Object.entries(dur).map(([k, v]) => { const moy = Math.round(v.s / v.n), d = moy - v.p; return `<div class="lrow"><div><div>${E(k)}</div><div class="mut small">prévu ${O.fmtDur(v.p)} · ${v.n} fois</div></div><div style="text-align:right"><b>${O.fmtDur(moy)}</b><div class="small" style="color:${d > 10 ? 'var(--ko)' : 'var(--ok)'}">${d > 10 ? '+' + O.fmtDur(d) + ' : rallonge la durée' : d < -10 ? 'plus rapide 🎉' : 'parfait ✓'}</div></div></div>`; }).join('') || '<div class="mut small">Utilise ▶️ Commencer / ✅ Terminer pendant tes poses : l\'app calcule ton vrai temps et te dit s\'il faut rallonger tes créneaux.</div>'}</div>
    <button class="light full" onclick="csv('${mo}')">⬇️ Exporter le mois (Excel / CSV)</button>`;
}
function csv(mo) {
  const L = S.rdv.filter(r => r.date.startsWith(mo)).sort(byTime);
  const c = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Date', 'Début', 'Fin', 'Cliente', 'Téléphone', 'Prestations', 'Prix', 'Statut', 'Payé', 'Paiement']].concat(L.map(r => [r.date, r.debut, r.fin, r.nom, r.tel, r.prestations, r.prix, O.STATUTS[r.statut], r.paye ? 'oui' : 'non', r.modePaiement]));
  O.download('rendez-vous-' + mo + '.csv', '﻿' + rows.map(r => r.map(c).join(';')).join('\n'), 'text/csv');
}
function vPresta() {
  return `<p class="mut">Ce que tes clientes voient sur la page de réservation. La durée sert à calculer les créneaux libres.</p>
    ${S.services.map((s, i) => `<div class="card" onclick="editSrv(${i})" style="cursor:pointer;${s.actif === false ? 'opacity:.5' : ''}"><div class="between"><b>${E(s.nom)}</b><b>${P(s.prix)}</b></div>
      <div class="mut small">${E(s.categorie || '')} · ${O.fmtDur(s.duree)}${s.actif === false ? ' · masquée' : ''}</div></div>`).join('')}
    <button class="full" onclick="editSrv(-1)">+ Ajouter une prestation</button>`;
}
function editSrv(i) {
  const s = i >= 0 ? S.services[i] : { id: 's' + O.uid(), nom: '', categorie: 'Mains', duree: 60, prix: 0, description: '', actif: true };
  const cats = [...new Set(S.services.map(x => x.categorie).filter(Boolean))];
  sheet(`<h3>${i >= 0 ? 'Modifier' : 'Nouvelle prestation'}</h3>
    <label for="sNom">Nom</label><input id="sNom" value="${E(s.nom)}" placeholder="Ex. Pose gel couleur">
    <label for="sCat">Catégorie</label><input id="sCat" list="catL" value="${E(s.categorie)}"><datalist id="catL">${cats.map(c => `<option value="${E(c)}">`).join('')}</datalist>
    <div class="grid2"><div><label for="sDur">Durée (min)</label><input id="sDur" type="number" inputmode="numeric" step="5" value="${s.duree}"></div>
      <div><label for="sPrix">Prix (${cfg().devise})</label><input id="sPrix" type="number" inputmode="decimal" value="${s.prix}"></div></div>
    <label for="sDesc">Description</label><textarea id="sDesc" placeholder="Visible par les clientes">${E(s.description)}</textarea>
    <label class="check"><input type="checkbox" id="sAct" ${s.actif !== false ? 'checked' : ''}> Visible sur la page de réservation</label>
    <button class="full" id="sSave">Enregistrer</button>
    ${i >= 0 ? `<div class="grid3" style="margin-top:10px"><button class="light sm" id="sUp">↑ Monter</button><button class="light sm" id="sDown">↓ Descendre</button><button class="light sm" style="color:var(--ko)" id="sDel">Supprimer</button></div>` : ''}`);
  const done = safe(async () => { closeSheet(); render(); await saveSrv(); });
  $('sSave').onclick = () => {
    const n = Object.assign(s, { nom: $('sNom').value.trim(), categorie: $('sCat').value.trim(), duree: Number($('sDur').value) || 0, prix: Number($('sPrix').value) || 0, description: $('sDesc').value.trim(), actif: $('sAct').checked });
    if (!n.nom || !n.duree) return O.toast('Nom et durée obligatoires');
    if (i < 0) S.services.push(n); done();
  };
  if (i >= 0) {
    const mv = d => { const j = i + d; if (j < 0 || j >= S.services.length) return; [S.services[i], S.services[j]] = [S.services[j], S.services[i]]; done(); };
    $('sUp').onclick = () => mv(-1); $('sDown').onclick = () => mv(1);
    $('sDel').onclick = () => { if (confirm('Supprimer « ' + s.nom + ' » ?')) { S.services.splice(i, 1); done(); } };
  }
}
const ORDRE = [1, 2, 3, 4, 5, 6, 0];
function vHoraires() {
  const H = cfg().horaires, F = (cfg().fermetures || []).filter(f => (f.au || f.du) >= O.today());
  return `<div class="card">${ORDRE.map(d => { const p = H[d] || []; return `<div class="dayrow" data-d="${d}">
      <label class="check" style="margin:0"><input type="checkbox" class="hOn" ${p.length ? 'checked' : ''}>${O.cap(O.JOURS[d]).slice(0, 3)}.</label>
      <div class="hP ${p.length ? '' : 'hide'}"><div class="hp"><input type="time" class="h1" value="${(p[0] || ['09:00'])[0]}"><span>–</span><input type="time" class="h2" value="${(p[0] || [, '12:00'])[1]}"></div>
        <div class="hp" style="margin-top:6px"><input type="time" class="h3" value="${(p[1] || [''])[0]}"><span>–</span><input type="time" class="h4" value="${(p[1] || [, ''])[1]}"></div>
        <div class="mut small">2e ligne = après la pause (laisser vide si pas de pause)</div></div>
      <div class="mut hF ${p.length ? 'hide' : ''}">Fermé</div></div>`; }).join('')}
    <button class="full" id="hSave" style="margin-top:12px">Enregistrer les horaires</button></div>
    <h2>🏖 Congés & jours fermés</h2>
    <div class="card">${F.map(f => `<div class="between task"><div>${O.cap(O.fmtDate(f.du))}${f.au && f.au !== f.du ? ' → ' + O.fmtDate(f.au) : ''}<div class="mut small">${E(f.motif || '')}</div></div><button class="x" onclick="delFerm('${f.du}','${f.au || ''}')">×</button></div>`).join('') || '<div class="mut">Aucun congé prévu</div>'}
      <div class="grid2" style="margin-top:10px"><div><label for="fDu">Du</label><input type="date" id="fDu"></div><div><label for="fAu">Au</label><input type="date" id="fAu"></div></div>
      <input id="fMot" placeholder="Motif (vacances, formation…)" style="margin-top:8px"><button class="ghost full" style="margin-top:8px" id="fAdd">+ Ajouter</button></div>`;
}
function bindHoraires() {
  document.querySelectorAll('.dayrow').forEach(r => r.querySelector('.hOn').onchange = e => { r.querySelector('.hP').classList.toggle('hide', !e.target.checked); r.querySelector('.hF').classList.toggle('hide', e.target.checked); });
  $('hSave').onclick = safe(async () => {
    const H = {};
    for (const r of document.querySelectorAll('.dayrow')) {
      const d = r.dataset.d, v = c => r.querySelector(c).value, p = [];
      if (r.querySelector('.hOn').checked) {
        if (v('.h1') && v('.h2')) p.push([v('.h1'), v('.h2')]);
        if (v('.h3') && v('.h4')) p.push([v('.h3'), v('.h4')]);
        if (p.some(([a, b]) => a >= b)) return O.toast('⚠️ ' + O.cap(O.JOURS[d]) + ' : l\'heure de fin doit être après le début');
      }
      H[d] = p;
    }
    S.config.horaires = H; await saveCfg('Horaires enregistrés ✅');
  });
  $('fAdd').onclick = safe(async () => {
    const du = $('fDu').value, au = $('fAu').value || du;
    if (!du) return O.toast('Choisis au moins la date de début');
    S.config.fermetures = (S.config.fermetures || []).concat([{ du, au: au < du ? du : au, motif: $('fMot').value.trim() }]).sort((a, b) => a.du.localeCompare(b.du));
    await saveCfg('Congé ajouté ✅');
  });
}
const delFerm = safe(async (du, au) => { S.config.fermetures = S.config.fermetures.filter(f => !(f.du === du && (f.au || '') === au)); await saveCfg('Supprimé'); });
function field(id, label, val, attrs) { return `<label for="${id}">${label}</label><input id="${id}" value="${E(val)}" ${attrs || ''}>`; }
function vSalon() {
  const c = cfg();
  return `<div class="card">${field('cNom', 'Nom du salon', c.nom)}${field('cSlo', 'Petite phrase', c.slogan)}${field('cAdr', 'Adresse', c.adresse, 'placeholder="Rue, NPA Ville"')}
    ${field('cTel', 'Téléphone', c.telephone, 'type="tel"')}${field('cIg', 'Instagram', c.instagram, 'placeholder="@monstudio"')}
    <div class="grid2"><div>${field('cDev', 'Monnaie', c.devise)}</div><div>${field('cInd', 'Indicatif pays', c.indicatif, 'inputmode="numeric" placeholder="41"')}</div></div>
    <label for="cMsg">Infos importantes (affichées avant de réserver)</label><textarea id="cMsg">${E(c.message)}</textarea>
    <button class="full" style="margin-top:12px" id="cSave">Enregistrer</button></div>`;
}
function sel(id, label, val, opts) { return `<label for="${id}">${label}</label><select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`; }
function vResa() {
  const c = cfg();
  return `<div class="card">
    ${sel('rVal', 'Validation des réservations', c.validation, [['auto', 'Automatique (confirmé tout de suite)'], ['manuelle', "Je valide chaque demande"]])}
    ${sel('rTam', 'Pause entre deux clientes', c.tampon, [[0, 'Aucune'], [5, '5 min'], [10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min']])}
    ${sel('rPas', 'Horaires proposés toutes les', c.pas, [[15, '15 min'], [30, '30 min'], [60, '1 heure']])}
    ${sel('rDel', 'Réserver au minimum', c.delaiMin, [[0, 'Sans délai'], [2, '2 h avant'], [12, '12 h avant'], [24, '1 jour avant'], [48, '2 jours avant']])}
    ${sel('rMax', 'Réserver au maximum', c.joursMax, [[14, '2 semaines à l\'avance'], [30, '1 mois à l\'avance'], [45, '6 semaines à l\'avance'], [60, '2 mois à l\'avance'], [90, '3 mois à l\'avance']])}
    ${sel('rAnn', 'Annulation en ligne possible jusqu\'à', c.annulationH, [[0, 'Le dernier moment'], [12, '12 h avant'], [24, '24 h avant'], [48, '48 h avant']])}
    <button class="full" style="margin-top:14px" id="rSaveCfg">Enregistrer</button></div>`;
}
function vConnexion() {
  return `<div class="card"><p class="small">Pour que tes clientes réservent depuis leur téléphone, l'app enregistre tout dans <b>ta Google Sheet</b> (gratuit). Le pas à pas est dans le fichier <b>README</b> du dossier <code>ongles</code>.</p>
    ${field('kUrl', 'Adresse de l\'app Google (finit par /exec)', localStorage.getItem('ongles-url') || '', 'placeholder="https://script.google.com/macros/s/…/exec"')}
    ${field('kTok', 'Mot de passe (TOKEN)', localStorage.getItem('ongles-token') || '', 'type="password"')}
    <button class="full" style="margin-top:12px" id="kSave">Enregistrer et tester</button></div>
    ${api.demo ? `<div class="card"><b>Mode démo</b><p class="mut small">Les données fictives restent sur ce téléphone.</p><button class="light full" id="kReset">Recommencer la démo</button></div>` : `<button class="light full" id="kDemo">Revenir au mode démo</button>`}`;
}
function bindPlus() {
  const b = (id, fn) => { const e = $(id); if (e) e.onclick = safe(fn); };
  if (sub === 'horaires') bindHoraires();
  b('cSave', async () => {
    Object.assign(S.config, { nom: $('cNom').value.trim() || 'Mon Studio', slogan: $('cSlo').value.trim(), adresse: $('cAdr').value.trim(), telephone: $('cTel').value.trim(), instagram: $('cIg').value.trim(), devise: $('cDev').value.trim() || 'CHF', indicatif: $('cInd').value.replace(/\D/g, '') || '41', message: $('cMsg').value.trim() });
    await saveCfg();
  });
  b('rSaveCfg', async () => {
    Object.assign(S.config, { validation: $('rVal').value, tampon: +$('rTam').value, pas: +$('rPas').value, delaiMin: +$('rDel').value, joursMax: +$('rMax').value, annulationH: +$('rAnn').value });
    await saveCfg();
  });
  b('kSave', async () => {
    const u = $('kUrl').value.trim(), t = $('kTok').value.trim();
    if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return O.toast("L'adresse doit commencer par https://script.google.com/");
    const test = new O.Api(u, t);
    if (u) { await test.call('ping'); }
    localStorage.setItem('ongles-url', u); localStorage.setItem('ongles-token', t);
    initApi(); await load(); O.toast(u ? 'Connexion OK ✅' : 'Mode démo'); sub = null; go('jour');
  });
  b('kReset', async () => { if (!confirm('Effacer les données de démo ?')) return; O.Demo.reset(); await load(); O.toast('Démo réinitialisée'); go('jour'); });
  b('kDemo', async () => { if (!confirm('Revenir au mode démo ? (tes vraies données restent dans la Google Sheet)')) return; localStorage.removeItem('ongles-url'); initApi(); await load(); go('jour'); });
}

/* ---------- Navigation ---------- */
function render() {
  if (!S) return;
  const v = { jour: vJour, agenda: vAgenda, clientes: vClientes, taches: vTaches, plus: vPlus }[tab];
  $('view').innerHTML = v();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('fab').classList.toggle('hide', !['jour', 'agenda'].includes(tab));
  const n = S.rdv.filter(r => r.statut === 'attente' && r.date >= O.today()).length, j = document.querySelector('nav [data-t=jour]');
  j.querySelector('.badge') && j.querySelector('.badge').remove();
  if (n) j.insertAdjacentHTML('beforeend', `<i class="badge">${n}</i>`);
  if (tab === 'taches') bindTaches();
  if (tab === 'plus') bindPlus();
  if (tab === 'clientes') { const i = $('q'); i.oninput = () => { q = i.value; const p = i.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(p, p); }; }
}
function go(t) { tab = t; if (t !== 'plus') sub = null; render(); scrollTo(0, 0); }
const refresh = safe(async silent => { await load(); render(); if (silent !== true) O.toast('À jour ✅', 1200); });
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
$('fab').onclick = () => openForm(null, tab === 'agenda' && weekStart && weekStart > O.today() ? weekStart : O.today());

setInterval(() => { if (!$('modal') && tab === 'jour' && document.visibilityState === 'visible') render(); }, 20000);
setInterval(async () => { if (!$('modal') && document.visibilityState === 'visible' && !api.demo && document.activeElement.tagName !== 'INPUT') { try { await load(); render(); } catch (e) { } } }, 90000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && !$('modal')) refresh(true); });

(async () => {
  initApi();
  try { await load(); render(); }
  catch (e) { $('view').innerHTML = `<div class="card">😕 ${E(e.message)}</div><button class="full" onclick="localStorage.removeItem('ongles-url');location.reload()">Passer en mode démo</button>`; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
